name: Real 2Spine PSD 360 licensed Spine Editor 4.3.26 gate
# Source candidate QA pulse: PRIVATE 2Spine experimental hidden-hemisphere exact SHA 5cd8a6a57dbd6280ee94e255770c93b147cd0f74; original PSD 7 layers 14 meshes nine interpolated control poses; 40-frame licensed Spine Editor visual comparison; release/art stays denied
# Keyed continuous mesh/texture regression; 40 official PNGs are validation-only,
# never assets for animation, spritesheets, or a flipbook.

on:
  workflow_call:
    secrets:
      SOURCE_REPO_TOKEN:
        required: true
      SPINE_LICENSE:
        required: true
      SPINE_LINUX_URL:
        required: true

permissions:
  contents: read
  actions: read

  contents: write # Private prerelease fallback stores native evidence when Actions quota is full
  actions: read

# Never run two licensed-editor sessions against this same candidate at once.
concurrency:
  group: licensed-spine43-3spine-core
  cancel-in-progress: false

jobs:
  real-360-editor:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    # Licensed Spine Editor is installed on the dedicated 3Spine Ubuntu runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: 3spine
    env:
      SOURCE_REPO: SpineAnimator/spine-animator-private
      SOURCE_BRANCH: main
      SPINE_LICENSE: ${{ secrets.SPINE_LICENSE }}
      SPINE_LINUX_URL: ${{ secrets.SPINE_LINUX_URL }}
    steps:
      - name: Checkout trusted 3Spine source on the public executor
        uses: actions/checkout@v4
        with:
          repository: vladleopold/3Spine-core
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: 3spine
          persist-credentials: false
      - name: Pin exact 3Spine source revision
        run: echo "THREESPINE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install passive visual-audit dependency
        run: python3 -m pip install --disable-pip-version-check 'Pillow>=10.3,<14'

      - name: Check visual gate regressions on synthetic source-like PNGs
        run: python3 -m unittest discover -s tests -p 'test_audit_volume360_*.py'

      - name: Select successful real PSD 360 runtime artifact for exact art head
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo '::error::ACCESS_TOKEN missing for private source artifact access'; exit 1; }
          # A private repository can return HTTP 404 when ACCESS_TOKEN is not authorized.
          # Diagnose permission failures before attempting artifact selection.
          if ! SOURCE_META="$(gh api "repos/$SOURCE_REPO" 2>&1)"; then
            echo "::error::ACCESS_TOKEN cannot read private source repository $SOURCE_REPO (check GitHub token repository access and contents/actions permissions)"
            exit 1
          fi
          printf '%s' "$SOURCE_META" | jq -e '.private == true and .default_branch != null' >/dev/null || {
            echo '::error::Private source metadata or default branch unavailable'; exit 1;
          }
          if ! HEAD_SHA="$(gh api "repos/$SOURCE_REPO/branches/$SOURCE_BRANCH" --jq .commit.sha 2>/dev/null)"; then
            echo "::error::ACCESS_TOKEN cannot read $SOURCE_REPO/$SOURCE_BRANCH; verify repository access and branch permissions"
            exit 1
          fi
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo '::error::Cannot pin source commit'; exit 1; }
          # The source project is now main-only. Take the latest successful
          # self-repository push build and compare its exact immutable SHA to
          # current main. Docs/cleanup commits need not invalidate the ZIP,
          # but ANY build-input change requires a fresh source runtime proof.
          RUN_ROW="$(gh api "repos/$SOURCE_REPO/actions/workflows/volume360-real-psd.yml/runs?status=success&branch=main&per_page=100" \
            --jq '[.workflow_runs[] | select(.head_branch == "main" and .event == "push" and .conclusion == "success")] | first | [.id, .head_sha] | @tsv')"
          read -r RUN_ID SOURCE_SHA <<< "$RUN_ROW"
          [[ "${RUN_ID:-}" =~ ^[0-9]{8,20}$ && "${SOURCE_SHA:-}" =~ ^[a-f0-9]{40}$ ]] || {
            echo '::error::No successful pinned main-source 360 ZIP'; exit 1;
          }
          RUN_META="$(gh api "repos/$SOURCE_REPO/actions/runs/$RUN_ID")"
          printf '%s' "$RUN_META" | jq -e --arg repo "$SOURCE_REPO" --arg source "$SOURCE_SHA" '
            .conclusion == "success" and .event == "push" and
            .head_branch == "main" and .head_sha == $source and
            .repository.full_name == $repo and .head_repository.full_name == $repo and
            (.path | endswith("/volume360-real-psd.yml"))
          ' >/dev/null || { echo '::error::Source run provenance not trusted'; exit 1; }
          COMPARE="$(gh api "repos/$SOURCE_REPO/compare/$SOURCE_SHA...$HEAD_SHA")"
          printf '%s' "$COMPARE" | jq -e '
            (.status == "identical") or
            (.status == "ahead" and .ahead_by <= 32 and (.files | length) < 300)
          ' >/dev/null || { echo '::error::Source artifact does not match recent main ancestry'; exit 1; }
          # No code, runtime, original fixture, dependency or workflow changes
          # may occur after the validated source SHA. Otherwise reject stale ZIP.
          CHANGED="$(printf '%s' "$COMPARE" | jq -r '.files[]?.filename')"
          if printf '%s\n' "$CHANGED" | grep -E '^(engine/(turn-|scene)|tools/(passive_psd_rgba_for_360|verify_real_psd_volume360)\.m?js$|tools/passive_psd_rgba_for_360\.py$|tests/fixtures/etalons/cherry/source\.psd$|\.github/workflows/volume360-real-psd\.yml$|package(-lock)?\.json$)'; then
            echo '::error::Main changed a PSD-360 build input since pinned source ZIP; rebuild required'
            exit 1
          fi
          echo "Pinned source CI SHA $SOURCE_SHA against current main $HEAD_SHA (no relevant build input changed)"
          ART_ID="$(gh api "repos/$SOURCE_REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "experimental-real-psd-volume360-runtime" and .expired == false)] | first | .id')"
          # Preserve the pinned source identity even if Actions artifact retention/quota
          # removed the archive. In that case rebuild from this exact checked-out
          # source commit with the SAME JS/Rust runtime verification commands.
          echo "SOURCE_HEAD_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "SOURCE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          if [[ ! "${ART_ID:-}" =~ ^[0-9]{8,20}$ ]]; then
            echo "::warning::Pinned source run $RUN_ID has no retained ZIP; rebuilding exact SHA $SOURCE_SHA independently before native Editor QA"
            echo "REBUILD_PINNED_RUNTIME=1" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p work/input
          curl --fail --location --silent --show-error --retry 2 --max-time 150 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$SOURCE_REPO/actions/artifacts/$ART_ID/zip" \
            -o work/input/runtime-evidence.zip
          unzip -t work/input/runtime-evidence.zip > /dev/null
          unzip -q work/input/runtime-evidence.zip -d work/input/unpacked
          ARTIFACT="$(find work/input/unpacked -name real-psd-volume360-spine-4.3.26.zip -type f -print -quit)"
          test -n "$ARTIFACT" && test -f "$ARTIFACT" || { echo '::error::Pinned ZIP payload missing'; exit 1; }
          echo "ARCHIVE_FILE=$ARTIFACT" >> "$GITHUB_ENV"
          echo "SOURCE_HEAD_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "SOURCE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "Pinned successful 360 proof: run $RUN_ID, tested $SOURCE_SHA, branch $SOURCE_BRANCH"

      - name: Check out the exact original PSD fixture commit for SHA evidence
        uses: actions/checkout@v4
        with:
          repository: SpineAnimator/spine-animator-private
          ref: ${{ env.SOURCE_HEAD_SHA }}
          path: source-commit
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false

      # Missing/expired GitHub Actions artifacts are not proof of a bad source
      # build. Recreate the ZIP ONLY from the CI-proven exact source SHA, never
      # from mutable main or a smaller substitute PSD. Runtime checks remain required.
      - name: Install pinned source Node when artifact needs regeneration
        if: ${{ env.REBUILD_PINNED_RUNTIME == '1' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild missing pinned ZIP and rerun source runtime gates
        if: ${{ env.REBUILD_PINNED_RUNTIME == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          cd source-commit
          npm ci
          python3 -m pip install --disable-pip-version-check 'psd-tools>=1.9' 'Pillow>=10'
          python3 tools/passive_psd_rgba_for_360.py \
            tests/fixtures/etalons/cherry/source.psd .test-output/volume360-input
          node tools/verify_real_psd_volume360.mjs \
            .test-output/volume360-input .test-output/volume360-result
          unzip -t .test-output/volume360-result/real-psd-volume360-spine-4.3.26.zip
          node tools/assert-continuous-spine-zip.cjs \
            .test-output/volume360-result/real-psd-volume360-spine-4.3.26.zip
          ZIP_PATH="$(pwd)/.test-output/volume360-result/real-psd-volume360-spine-4.3.26.zip"
          test -s "$ZIP_PATH"
          echo "ARCHIVE_FILE=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "Rebuilt pinned source ZIP at SHA $SOURCE_HEAD_SHA; native Editor and art gates still pending" >> "$GITHUB_STEP_SUMMARY"

      - name: Reject small fixture and require the exact original cherry(3).psd
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,zipfile
          psd=Path('source-commit/tests/fixtures/etalons/cherry/source.psd')
          expected_sha='b5f50a5dc500ee2c45d1c817213995ab092a33b754febc903aa5e861b20757d4'
          expected_bytes=40062699
          assert psd.is_file(), 'original cherry(3).psd unavailable'
          actual_bytes=psd.stat().st_size
          actual_sha=hashlib.sha256(psd.read_bytes()).hexdigest()
          assert actual_bytes==expected_bytes, f'refusing fixture/substitute: expected {expected_bytes} bytes, got {actual_bytes}'
          assert actual_sha==expected_sha, f'refusing wrong PSD: expected {expected_sha}, got {actual_sha}'
          with zipfile.ZipFile(os.environ['ARCHIVE_FILE']) as z:
              assert z.testzip() is None
              manifest=json.loads(z.read('manifest.json'))
              assert manifest['sourceSha256']==expected_sha
              assert manifest['sourceBytes']==expected_bytes
              assert manifest['sourceSha256']==actual_sha
              assert manifest['editorVerified'] is False
              assert manifest['artisticApproval'] is False
              print('ORIGINAL_CHERRY_PSD_SOURCE_SHA_VERIFIED',actual_sha,actual_bytes)
          PY

      - name: Require existing authorized Spine 4.3.26 Linux license
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SPINE_LICENSE" || { echo '::error::SPINE_LICENSE missing'; exit 1; }
          test -n "$SPINE_LINUX_URL" || { echo '::error::SPINE_LINUX_URL missing'; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11-utils x11-xserver-utils libxrandr2 libgl1-mesa-dri libgl1 libxrender1 libxi6 libxext6 libxfixes3 libxcursor1
          curl --fail --location --silent --show-error --max-time 600 --retry 2 \
            -A 'Mozilla/5.0 (X11; Linux x86_64)' \
            "$SPINE_LINUX_URL" -o "$RUNNER_TEMP/spine-linux.gz"
          gzip -t "$RUNNER_TEMP/spine-linux.gz"
          mkdir -p "$RUNNER_TEMP/spine"
          gzip -dc "$RUNNER_TEMP/spine-linux.gz" | tar -xf - -C "$RUNNER_TEMP/spine"
          SPINE_CLI="$RUNNER_TEMP/spine/Spine/Spine.sh"
          test -x "$SPINE_CLI" || { echo '::error::Licensed Spine.sh is missing'; exit 1; }
          echo "SPINE_CLI=$SPINE_CLI" >> "$GITHUB_ENV"

      - name: Import, export editable nonessential mesh and render every 360 frame in the real Editor
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          xvfb-run -a -s '-screen 0 1600x1000x24' \
            python3 scripts/verify_volume360_editor_linux.py \
              --archive "$ARCHIVE_FILE" \
              --spine "$SPINE_CLI" \
              --output work/editor

      - name: Reject rectangular, clipped or low-detail rear cherries in actual Spine Editor PNG frames
        shell: bash
        run: |
          python3 scripts/audit_volume360_visual.py \
            --frames-dir work/editor/screenshots \
            --output work/editor/official-360-visual-audit.json

      - name: Generate unapproved visual review sheets for ALL 40 actual Editor frames
        if: always()
        shell: bash
        run: |
          if [ -d work/editor/screenshots ]; then
            python3 scripts/create_editor360_review_sheets.py \
              --frames-dir work/editor/screenshots \
              --sheet-out work/editor/official-360-all-frames.jpg \
              --focus-out work/editor/official-360-key-poses.jpg \
              --report-out work/editor/official-360-frame-hashes.json \
              --expected-count 40 \
              --source-ref "${SOURCE_HEAD_SHA:-}"
          fi

      - name: Preserve editor evidence even if acceptance fails
        if: false # Native evidence contains private artwork; publish only to the private 3Spine repository.
        continue-on-error: true # Storage billing/quota must not mask the actual licensed Editor gate.
        id: native_evidence_upload
        uses: actions/upload-artifact@v4
        with:
          name: real-psd-360-licensed-editor-unapproved-evidence
          if-no-files-found: warn
          retention-days: 7
          path: |
            work/editor/official-360-editor-report.json
            work/editor/official-360-visual-audit.json
            work/editor/official-360-all-frames.jpg
            work/editor/official-360-key-poses.jpg
            work/editor/official-360-frame-hashes.json
            work/editor/real-psd-volume360-editor-4.3.26.spine
            work/editor/roundtrip/
            work/editor/screenshots/
            work/input/unpacked/volume360-audit.json

      # GitHub Actions storage was exhausted on run 43162196978, so a successful
      # Editor run had no retrievable PNGs. Use a PRIVATE repository prerelease,
      # never a public deployment, as a quota-independent evidence fallback.
      # This is not a release of art or an automatic artistic approval.
      - name: Preserve genuine native PNGs in private prerelease if Actions storage is full
        if: ${{ always() && steps.native_evidence_upload.outcome != 'success' && github.event_name != 'pull_request' && hashFiles('work/editor/official-360-editor-report.json') != '' }}
        shell: bash
        env:
          # GITHUB_TOKEN received Release write 403 in native run 43165716453.
          # The connected private cross-repository credential can be tried
          # without exposing its value. GitHub's own token stays the fallback.
          ACCESS_TOKEN_FOR_RELEASE: ${{ secrets.SOURCE_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          GH_REPO: vladleopold/3Spine-core
        run: |
          set -euo pipefail
          test "$GH_REPO" = 'vladleopold/3Spine-core'
          test -f work/editor/official-360-editor-report.json
          test -f work/editor/official-360-visual-audit.json
          test -f work/editor/official-360-frame-hashes.json
          test -d work/editor/screenshots
          test "$(find work/editor/screenshots -name '*.png' -type f | wc -l)" -eq 40
          python3 - <<'PY'
          import json
          from pathlib import Path
          editor=json.loads(Path('work/editor/official-360-editor-report.json').read_text())
          audit=json.loads(Path('work/editor/official-360-visual-audit.json').read_text())
          assert editor.get('editor_import_verified') is True
          assert editor.get('official_render_frames') == 40
          assert audit.get('artisticQualityApproved') is False
          assert audit.get('publicationReady') is False
          PY
          mkdir -p work/evidence-fallback
          archive="$PWD/work/evidence-fallback/native-spine43-40frames-${GITHUB_RUN_ID}.zip"
          zip -qr "$archive" \
            work/editor/official-360-editor-report.json \
            work/editor/official-360-visual-audit.json \
            work/editor/official-360-frame-hashes.json \
            work/editor/official-360-all-frames.jpg \
            work/editor/official-360-key-poses.jpg \
            work/editor/real-psd-volume360-editor-4.3.26.spine \
            work/editor/roundtrip \
            work/editor/screenshots
          unzip -t "$archive" >/dev/null
          sha256sum "$archive"
          tag="native-360-evidence-run-${GITHUB_RUN_ID}"
          cat > work/evidence-fallback/NOTES.md <<EOF
          **PRIVATE NATIVE QA EVIDENCE — ARTWORK NOT APPROVED**
          
          Licensed Spine 4.3.26 Editor run: ${GITHUB_RUN_ID}
          Source SHA: ${SOURCE_HEAD_SHA:-unavailable}
          Original PSD SHA and test results are in the attached JSON reports.
          Includes 40 official rendered PNG frames and editable .spine project.
          This prerelease is NOT production, NOT a public animation and NOT
          independent artistic sign-off. Preserve the failed visual verdict.
          EOF
          if [ -n "${ACCESS_TOKEN_FOR_RELEASE:-}" ]; then
            echo 'Trying connected private release credential without printing it.'
            if GH_TOKEN="$ACCESS_TOKEN_FOR_RELEASE" gh release create "$tag" "$archive" \
              --repo "$GH_REPO" --target "$THREESPINE_SHA" --prerelease \
              --latest=false --title "PRIVATE native 360 QA ${GITHUB_RUN_ID} (UNAPPROVED)" \
              --notes-file work/evidence-fallback/NOTES.md; then
              export GH_TOKEN="$ACCESS_TOKEN_FOR_RELEASE"
            else
              echo 'Connected release credential lacked release-write access; trying ephemeral workflow token.'
              gh release create "$tag" "$archive" \
                --repo "$GH_REPO" --target "$THREESPINE_SHA" --prerelease \
                --latest=false --title "PRIVATE native 360 QA ${GITHUB_RUN_ID} (UNAPPROVED)" \
                --notes-file work/evidence-fallback/NOTES.md
            fi
          else
            gh release create "$tag" "$archive" \
              --repo "$GH_REPO" --target "$THREESPINE_SHA" --prerelease \
              --latest=false --title "PRIVATE native 360 QA ${GITHUB_RUN_ID} (UNAPPROVED)" \
              --notes-file work/evidence-fallback/NOTES.md
          fi
          gh release view "$tag" --repo "$GH_REPO" --json assets \
            --jq '.assets[] | select(.name | endswith(".zip")) | .name' |
            grep -Fx "$(basename "$archive")"
          echo "NATIVE_EVIDENCE_FALLBACK_URL=https://github.com/$GH_REPO/releases/tag/$tag" >> "$GITHUB_ENV"

      # Keep a small, read-only visual contact sheet directly accessible to
      # connected reviewers when Actions artifact quota is exhausted.
      # The full 40 PNGs stay in a PRIVATE prerelease, not the source repo.
      # Never submit this evidence to any public destination.
      - name: Publish latest official native 40-frame contact sheet in private QA repository
        if: ${{ always() && github.event_name != 'pull_request' && hashFiles('work/editor/official-360-frame-hashes.json') != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GH_REPO" = 'vladleopold/3Spine-core'
          test -s work/editor/official-360-all-frames.jpg
          test -s work/editor/official-360-key-poses.jpg
          test -s work/editor/official-360-editor-report.json
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          editor=json.loads(Path('work/editor/official-360-editor-report.json').read_text())
          visual=json.loads(Path('work/editor/official-360-visual-audit.json').read_text())
          frames=json.loads(Path('work/editor/official-360-frame-hashes.json').read_text())
          assert editor['official_render_frames']==40
          assert editor['artistic_quality_approved'] is False
          assert visual['artisticQualityApproved'] is False
          report={
              'schema':'2spine.private.native-editor-contact-sheet.v1',
              'repository':'vladleopold/3Spine-core',
              'editor':'licensed Spine 4.3.26',
              'native_run_id':os.environ['GITHUB_RUN_ID'],
              'source_git_sha':os.environ.get('SOURCE_HEAD_SHA'),
              'source_psd_sha256':editor['source_psd_sha256'],
              'source_archive_sha256':editor['source_archive_sha256'],
              'official_frame_count':40,
              'visual_gate_status':visual['status'],
              'artistic_quality_approved':False,
              'publication_ready':False,
              'contact_sheet_sha256':hashlib.sha256(Path('work/editor/official-360-all-frames.jpg').read_bytes()).hexdigest(),
              'focus_sheet_sha256':hashlib.sha256(Path('work/editor/official-360-key-poses.jpg').read_bytes()).hexdigest(),
              'frame_hashes':frames,
              'note':'Official native frames; contact sheet is NOT artistic approval. Full original-size frames are private release evidence.'
          }
          Path('work/editor/native-review-index.json').write_text(json.dumps(report,indent=2)+'\\n')
          PY
          upload() {
            local file="$1" target="$2" existing=""
            # NEVER place an entire base64 image on argv. 100k+ byte
            # contact sheets exceed Linux MAX_ARG_STRLEN and fail exit 126.
            # GH CLI safely streams the JSON request body from a private file.
            local attempt=0 ok=0
            for attempt in 1 2 3 4 5; do
              # GitHub Actions other jobs may update main while we publish.
              # Read the CURRENT blob SHA every retry, so a 409 cannot leave
              # a successful Editor review without a private contact sheet.
              existing="$(gh api "repos/$GH_REPO/contents/$target?ref=main" --jq '.sha' 2>/dev/null || true)"
              python3 - "$file" "$existing" <<'PY'
          import base64,json,os,sys
          from pathlib import Path
          path,sha=sys.argv[1:]
          data={
              'message':'qa(native360): latest private genuine Editor frames (unapproved) run '+os.environ['GITHUB_RUN_ID'],
              'content':base64.b64encode(Path(path).read_bytes()).decode('ascii'),
              'branch':'main'
          }
          if sha:data['sha']=sha
          Path('work/evidence-fallback/gh-contact-upload-payload.json').write_text(
              json.dumps(data,separators=(',',':')))
          PY
              if gh api "repos/$GH_REPO/contents/$target" -X PUT \
                  --input work/evidence-fallback/gh-contact-upload-payload.json >/dev/null 2>work/evidence-fallback/gh-upload-errors.log; then
                ok=1; break
              fi
              if ! grep -Eq 'HTTP (409|422)' work/evidence-fallback/gh-upload-errors.log; then
                cat work/evidence-fallback/gh-upload-errors.log >&2
                return 1
              fi
              echo "::warning::Native contact sheet conflicted with parallel main update; retry $attempt/5"
              sleep "$attempt"
            done
            rm -f work/evidence-fallback/gh-contact-upload-payload.json
            if [ "$ok" -ne 1 ]; then
              echo "::error::Exhausted attempts to save exact native contact sheet"
              return 1
            fi
          }
          upload work/editor/official-360-all-frames.jpg quality/evidence/native-360-latest-40frames.jpg
          upload work/editor/official-360-key-poses.jpg quality/evidence/native-360-latest-poses.jpg
          upload work/editor/native-review-index.json quality/evidence/native-360-latest-index.json
          echo "NATIVE_REVIEW_CONTACT_URL=https://github.com/$GH_REPO/blob/main/quality/evidence/native-360-latest-40frames.jpg" >> "$GITHUB_ENV"

      - name: Record real Editor validation in job summary even if artifact storage is full
        if: always()
        shell: bash
        run: |
          {
            echo '## Real licensed Spine Editor 4.3.26 validation'
            if [ -f work/editor/official-360-editor-report.json ]; then
              echo 'Editor report generated. Source editor validation and 40-frame visual gate are separate from artifact upload.'
              echo '### Evidence hashes (SHA-256)'
              sha256sum work/editor/official-360-editor-report.json work/editor/official-360-visual-audit.json work/editor/official-360-frame-hashes.json 2>/dev/null || true
              echo 'Evidence upload may be unavailable when GitHub Actions artifact quota is exhausted.'
            else
              echo 'Editor report unavailable: check prior job steps for the actual failure.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deactivate licensed Editor on ephemeral runner
        if: always()
        shell: bash
        run: |
          if [ -n "${SPINE_CLI:-}" ] && [ -x "$SPINE_CLI" ]; then
            timeout 180 xvfb-run -a "$SPINE_CLI" -l >/dev/null 2>&1 || true
          fi
