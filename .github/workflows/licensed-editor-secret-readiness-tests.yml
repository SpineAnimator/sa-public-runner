name: Licensed Editor secret readiness tests

on:
  pull_request:
    paths:
      - '.github/workflows/automatic-licensed-editor-gate.yml'
      - '.github/workflows/licensed-editor-secret-readiness-tests.yml'
      - 'scripts/check-licensed-editor-secrets.sh'
      - 'tests/test_licensed_editor_secret_readiness.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/automatic-licensed-editor-gate.yml'
      - '.github/workflows/licensed-editor-secret-readiness-tests.yml'
      - 'scripts/check-licensed-editor-secrets.sh'
      - 'tests/test_licensed_editor_secret_readiness.sh'

permissions:
  contents: read

jobs:
  readiness-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise missing, complete, and partial secret sets
        run: bash tests/test_licensed_editor_secret_readiness.sh
