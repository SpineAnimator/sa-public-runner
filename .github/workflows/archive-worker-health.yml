name: Spine Archive Manifest, Asset API and PSD Cache health
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-worker-health.yml'
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spine-archive-health
  cancel-in-progress: true
jobs:
  health:
    name: Verify selected Cloudflare account Workers (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check archive manifest health without uploading data
        uses: actions/github-script@v7
        with:
          script: |
            const checks = [
              {
                name: 'archive manifest',
                url: 'https://spine-archive.spine-animator-f8692224.workers.dev/health',
                validate(body) {
                  return body.service === '3spine-archive' &&
                    body.status === 'ready' &&
                    body.storage === 'workers-kv' &&
                    body.format === 'private-ref-manifest' &&
                    Number.isInteger(body.branchSnapshotCount) &&
                    body.branchSnapshotCount > 0 &&
                    body.archivePayloads === 'uploaded' &&
                    Number.isInteger(body.archivedWorkerCount) &&
                    body.archivedWorkerCount > 0 &&
                    body.publicWrite === false &&
                    body.assetUpload === true &&
                    body.privateArchive === false;
                }
              },
              {
                name: 'archive asset API readiness',
                url: 'https://spine-archive.spine-animator-f8692224.workers.dev/api/health',
                validate(body) {
                  return body.ok === true &&
                    body.assetUpload === true &&
                    body.privateArchive === false &&
                    body.maxAssetBytes === 64 * 1024 * 1024 &&
                    body.primaryProvider === 'catbox' &&
                    body.providerSelection === 'catbox-first-verified-kv-fallback' &&
                    body.fallbackProvider === 'cloudflare-kv' &&
                    body.fallbackTtlSeconds === 2592000;
                }
              },
              {
                name: 'PSD source cache',
                url: 'https://spine-psd-cache.spine-animator-f8692224.workers.dev/api/health',
                validate(body) {
                  return body.ok === true &&
                    body.cache === 'workers-kv' &&
                    body.ingest === 'github-oidc' &&
                    Number.isInteger(body.maxBytes) &&
                    body.maxBytes > 0;
                }
              }
            ];
            for (const check of checks) {
              const response = await fetch(check.url, {
                headers: { accept: 'application/json', 'cache-control': 'no-cache' },
                signal: AbortSignal.timeout(15000)
              });
              if (!response.ok) {
                throw new Error(`${check.name} health returned HTTP ${response.status}`);
              }
              const body = await response.json();
              if (!check.validate(body)) {
                throw new Error(`${check.name} health contract mismatch: ${JSON.stringify(body)}`);
              }
              core.info(`${check.name}: HTTP ${response.status}; read-only health contract passed.`);
            }
            core.notice('This gate verifies manifest health, asset API readiness and PSD cache health. privateArchive=false is expected while GITHUB_LIBRARY_TOKEN is absent; the separate live E2E reports the actual provider and SHA result. This does not certify Photoshop export or Spine Editor import.');
