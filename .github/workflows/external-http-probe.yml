name: External HTTP probe (public Ubuntu)

on:
  push:
    branches: [main, "task/**"]
    paths:
      - ".github/workflows/external-http-probe.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/external-http-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe external HTTPS and production health endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          failed=0
          urls=(
            https://example.com/
            https://httpbin.org/status/200
            https://api.github.com/
            https://spine-archive.spine-animator-f8692224.workers.dev/health
            https://spine-archive.spine-animator-f8692224.workers.dev/api/health
            https://spine-psd-cache.spine-animator-f8692224.workers.dev/api/health
          )
          echo "probe_target_count=${#urls[@]}"
          for url in "${urls[@]}"; do
            name="$(printf '%s' "$url" | sed -E 's#https://##; s#[^A-Za-z0-9]+#_#g; s#_$##')"
            echo "=== $url ==="
            status="$(curl --silent --show-error --location --max-time 20 \
              --output "probe/${name}.body" --dump-header "probe/${name}.headers" \
              --write-out '%{http_code}' "$url")" || status="000"
            printf '%s\n' "$status" | tee "probe/${name}.status"
            if [[ "$url" == *".workers.dev/"* ]] && [[ "$status" != "200" ]]; then
              echo "REQUIRED HEALTH CHECK FAILED: $url returned $status"
              failed=1
            fi
            sed -n '1,12p' "probe/${name}.headers" || true
            head -c 600 "probe/${name}.body" || true
            printf '\n'
          done
          {
            echo "runner=$(uname -a)"
            echo "date_utc=$(date -u +%FT%TZ)"
            echo "curl=$(curl --version | head -n1)"
            echo "required_health_failure=$failed"
            for f in probe/*.status; do printf '%s=%s\n' "$(basename "$f" .status)" "$(cat "$f")"; done
          } | tee probe/summary.txt
          exit "$failed"
      - name: Upload raw HTTP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-http-evidence
          path: probe/
          if-no-files-found: warn
          retention-days: 14
