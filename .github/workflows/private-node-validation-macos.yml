name: Private repository Node validation (authorized macOS runner)
on:
  workflow_call:
    inputs:
      checkout-ref:
        description: Exact branch or commit in the calling private repository
        required: true
        type: string
      suite:
        description: Fixed validation suite to execute
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: sa-private-macos-${{ github.repository }}-${{ inputs.suite }}-${{ inputs.checkout-ref }}
  cancel-in-progress: false
jobs:
  validate:
    name: ${{ inputs.suite }} on caller-authorized self-hosted macOS
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 45
    steps:
      - name: Verify runner belongs to caller context
        shell: bash
        run: |
          set -euo pipefail
          echo "caller_repository=${GITHUB_REPOSITORY}"
          echo "runner_name=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          test "${RUNNER_OS}" = "macOS"
          test "${RUNNER_ARCH}" = "X64"
          uname -a
      - name: Checkout private caller source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.checkout-ref }}
          token: ${{ github.token }}
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Semantic contour and reconstruction suite
        if: inputs.suite == 'semantic-contour'
        run: |
          node --test tests/semantic-contour-renderer.test.cjs tests/reconstruction-qa.test.cjs tests/layer-budget-optimizer.test.cjs tests/semantic-anatomy-plan.test.cjs tests/sa-semantic-contour-adapter.test.cjs tests/scene-ir-animation-planner.test.cjs tests/vision-holes.test.cjs tests/job-handoff.test.mjs tests/job-handoff-http.test.mjs tests/sa-agent.test.cjs
          npm test
      - name: Generator suite
        if: inputs.suite == 'generator'
        run: |
          npm run build:cloud-generator
          node --test tests/scene-export.test.cjs tests/cloud-generator.test.cjs tests/art-direction.test.cjs tests/artistic-score.test.cjs tests/js-ik-pack.test.mjs tests/js-psd-scene.test.mjs tests/command.test.cjs tests/remote-planner.test.cjs
      - name: Full Node suite
        if: inputs.suite == 'full'
        run: npm test
      - name: Reject unknown suite
        if: inputs.suite != 'semantic-contour' && inputs.suite != 'generator' && inputs.suite != 'full'
        run: |
          echo "::error::Unsupported suite input"
          exit 1
