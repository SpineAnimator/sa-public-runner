name: clgb71 live PSD to PNG to Spine 4.3 runtime gate

on:
  push:
    branches:
      - task/sa-core-vision-animation-planner-20261123
    paths:
      - ".github/workflows/clgb71-live-psd-spine-runtime.yml"
      - "tools/verify_zombie_psd.py"
      - "tools/extract_clgb71_layers.py"
      - "engine/rig.js"
      - "engine/bone-structure.js"
      - "engine/motion.js"
      - "engine/intent.js"
      - "engine/etalons.js"
      - "tools/verify_clgb71_rig.mjs"
      - "tools/clgb71-art-finish.cjs"
      - "tools/package_clgb71_ik.mjs"
      - "tools/verify_clgb71_ik_package.mjs"
      - "tools/export_spine_contact_poses.mjs"
      - "tools/verify_clgb71_fidelity.py"
      - "tools/guard_spine_contacts.py"
      - "tools/verify_clgb71_editor_linux.py"
      - "tools/audit_psd_editor_color.py"
      - "tests/real-clgb71-rig.test.cjs"
      - "tests/runtime-contact-evidence.test.mjs"
      - "tests/js-ik-pack.test.mjs"
      - "requirements.txt"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clgb71-public-psd-spine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-psd-spine:
    name: Ubuntu 24.04 • real PSD / 38 PNG / Spine runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: ""

      - name: Install PSD raster dependencies
        run: python -m pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: false

      - name: Install official Spine runtime dependency
        run: npm ci --ignore-scripts

      - name: Run offline PSD source-contract and image-evidence unit tests
        run: python -m unittest discover -s tests -p "test*.py"

      - name: Download exact approved original PSD and derive non-pixel 38-layer manifest
        env:
          PSD_FORCE_VERIFIED_CACHE: "1"
          PSD_LAYER_MANIFEST: .test-output/clgb71-ik/original-layers.json
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .test-output/clgb71-ik results
          python tools/verify_zombie_psd.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path(".test-output/clgb71-ik/original-layers.json")
          m=json.loads(p.read_text(encoding="utf-8"))
          assert m["source_sha256"] == "7adee866547a3b3cc9838b655cf70865980c5dba00313373cbf903fed776c7b2"
          assert m["source_bytes"] == 4485543
          assert m["canvas"] == {"width": 918, "height": 657}
          assert len(m["layers"]) == 38
          assert m["contains_source_pixels"] is False
          assert m["retrieval_route"] == "oidc-verified-kv"
          summary={
            "source_sha256":m["source_sha256"],
            "source_bytes":m["source_bytes"],
            "canvas":m["canvas"],
            "retrieval_route":m["retrieval_route"],
            "visible_leaf_layers":len(m["layers"]),
            "contains_source_pixels":False
          }
          Path("results/clgb71-source-summary.json").write_text(
            json.dumps(summary,indent=2)+"\n",encoding="utf-8")
          print("APPROVED_SOURCE_MANIFEST_VERIFIED",json.dumps(summary))
          PY
          echo "PSD_LAYER_MANIFEST=$GITHUB_WORKSPACE/.test-output/clgb71-ik/original-layers.json" >> "$GITHUB_ENV"

      - name: Extract original PSD raster layers to temporary PNGs only
        shell: bash
        run: |
          set -euo pipefail
          python tools/extract_clgb71_layers.py \
            /tmp/zombie-pistol.psd \
            "$PSD_LAYER_MANIFEST" \
            .test-output/clgb71-ik/package
          cp .test-output/clgb71-ik/package/psd-extraction-receipt.json \
            .test-output/clgb71-ik/psd-extraction-receipt.json

      - name: Run full Node suite with the live approved PSD manifest
        run: node --test

      - name: Build and independently audit the original 38-layer IK rig
        run: |
          node tools/verify_clgb71_rig.mjs \
            "$PSD_LAYER_MANIFEST" \
            .test-output/clgb71-ik/rig-runtime-report.json \
            .test-output/clgb71-ik/skeleton.json

      - name: Package original PNG layers and JS-authored animation into temporary Spine ZIP
        run: |
          node tools/package_clgb71_ik.mjs \
            "$PSD_LAYER_MANIFEST" \
            .test-output/clgb71-ik/skeleton.json \
            .test-output/clgb71-ik/package \
            .test-output/clgb71-ik/original-ik-spine-4.3.26.zip \
            .test-output/clgb71-ik/ik-package-report.json

      - name: Validate atlas, all 38 original slots, both IK chains and Spine runtime import
        run: node tools/verify_clgb71_ik_package.mjs .test-output/clgb71-ik/package

      - name: Sample actual constraint-solved animation poses at 60 Hz
        run: |
          node tools/export_spine_contact_poses.mjs \
            --bundle .test-output/clgb71-ik/original-ik-spine-4.3.26.zip \
            --out .test-output/clgb71-ik/runtime-contact-poses.json

      - name: Compare all 38 exported PNG layers against original PSD pixels and profile Photoshop effects
        run: |
          python tools/verify_clgb71_fidelity.py \
            /tmp/zombie-pistol.psd \
            .test-output/clgb71-ik/original-ik-spine-4.3.26.zip \
            .test-output/clgb71-ik/visual-evidence

      - name: Enforce hand, weapon and protected-layer contact gate
        run: |
          python tools/guard_spine_contacts.py \
            --bundle .test-output/clgb71-ik/original-ik-spine-4.3.26.zip \
            --report .test-output/clgb71-ik/attachment-contact-report.json

      - name: Check whether licensed Spine Editor secrets are available in this public runner
        id: editor_credentials
        env:
          SPINE_LICENSE: ${{ secrets.SPINE_LICENSE }}
          SPINE_LINUX_URL: ${{ secrets.SPINE_LINUX_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${SPINE_LICENSE:-}" && -n "${SPINE_LINUX_URL:-}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "NATIVE_EDITOR_READY=1" >> "$GITHUB_ENV"
            echo "Licensed Editor credentials are present; native 4.3.26 gate will run."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "NATIVE_EDITOR_READY=0" >> "$GITHUB_ENV"
            echo "::notice::Native Editor 4.3.26 gate is blocked: public runner needs SPINE_LICENSE and SPINE_LINUX_URL repository secrets. No license values are printed."
          fi

      - name: Install licensed Spine Editor 4.3.26 Linux launcher
        id: native_editor_install
        if: steps.editor_credentials.outputs.available == 'true'
        env:
          SPINE_LINUX_URL: ${{ secrets.SPINE_LINUX_URL }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11-utils x11-xserver-utils libxrandr2 libgl1-mesa-dri libgl1 libxrender1 libxi6 libxext6 libxfixes3 libxcursor1
          curl --fail --location --silent --show-error --max-time 600 --retry 2 \
            -A "Mozilla/5.0 (X11; Linux x86_64)" \
            "$SPINE_LINUX_URL" -o "$RUNNER_TEMP/spine-linux.gz"
          gzip -t "$RUNNER_TEMP/spine-linux.gz"
          mkdir -p "$RUNNER_TEMP/spine"
          gzip -dc "$RUNNER_TEMP/spine-linux.gz" | tar -xf - -C "$RUNNER_TEMP/spine"
          SPINE_SCRIPT="$RUNNER_TEMP/spine/Spine/Spine.sh"
          test -x "$SPINE_SCRIPT" || { echo "::error::Spine.sh missing from licensed archive"; exit 1; }
          echo "SPINE_CLI=$SPINE_SCRIPT" >> "$GITHUB_ENV"

      - name: Import, reopen, round-trip and render with actual Spine Editor 4.3.26
        id: native_editor_import
        if: steps.editor_credentials.outputs.available == 'true'
        env:
          SPINE_LICENSE: ${{ secrets.SPINE_LICENSE }}
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1600x1000x24' \
            python tools/verify_clgb71_editor_linux.py \
              --archive .test-output/clgb71-ik/original-ik-spine-4.3.26.zip \
              --spine "$SPINE_CLI" \
              --package-report .test-output/clgb71-ik/ik-package-report.json \
              --output .test-output/clgb71-ik/editor

      - name: Compare licensed Editor rest renders against saved PSD preview and forced layer composite
        id: native_editor_color
        if: steps.native_editor_import.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python tools/audit_psd_editor_color.py \
            --psd-composite .test-output/clgb71-ik/visual-evidence/source-psd-composite.png \
            --editor-screenshots .test-output/clgb71-ik/editor/screenshots \
            --layer-composite .test-output/clgb71-ik/visual-evidence/exported-layer-composite-approx.png \
            --forced-recomposite .test-output/clgb71-ik/visual-evidence/source-psd-recomputed-from-layers.png \
            --output .test-output/clgb71-ik/editor/psd-editor-color-evidence.json \
            --fail-on-color-mismatch

      - name: Record native Editor gate status without exposing license details
        if: always()
        env:
          EDITOR_CREDENTIALS_AVAILABLE: ${{ steps.editor_credentials.outputs.available }}
          EDITOR_INSTALL_OUTCOME: ${{ steps.native_editor_install.outcome }}
          EDITOR_IMPORT_OUTCOME: ${{ steps.native_editor_import.outcome }}
          EDITOR_COLOR_OUTCOME: ${{ steps.native_editor_color.outcome }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          available=os.environ.get("EDITOR_CREDENTIALS_AVAILABLE") == "true"
          install=os.environ.get("EDITOR_INSTALL_OUTCOME", "skipped")
          imported=os.environ.get("EDITOR_IMPORT_OUTCOME", "skipped")
          color=os.environ.get("EDITOR_COLOR_OUTCOME", "skipped")
          report_path=Path(".test-output/clgb71-ik/editor/editor-roundtrip-report.json")
          color_path=Path(".test-output/clgb71-ik/editor/psd-editor-color-evidence.json")
          report=json.loads(report_path.read_text()) if report_path.exists() else {}
          color_report=json.loads(color_path.read_text()) if color_path.exists() else {}
          if not available:
              status="blocked_missing_public_runner_secrets"
          elif install != "success":
              status="failed_editor_install"
          elif imported != "success" or report.get("editor_import_verified") is not True:
              status="failed_native_editor_import"
          elif color != "success" or color_report.get("status") != "PASS_COLOR_COMPOSITE_PARITY":
              status="native_editor_import_pass_color_parity_blocked"
          else:
              status="native_editor_4_3_26_import_and_color_parity_pass"
          result={
              "status":status,
              "licensed_editor_credentials_available":available,
              "editor_install_outcome":install,
              "editor_import_outcome":imported,
              "editor_color_parity_outcome":color,
              "editor_import_verified":report.get("editor_import_verified",False),
              "roundtrip_spine_version":report.get("roundtrip_spine_version"),
              "slots":report.get("slots"),
              "ik_constraints":report.get("ik_constraints"),
              "official_rendered_frames":len(report.get("official_rendered_frames",[])),
              "photoshop_color_parity_status":color_report.get("status"),
              "artistic_quality_approved":False,
              "release_ready":False
          }
          Path(".test-output/clgb71-ik/native-editor-status.json").write_text(
              json.dumps(result,indent=2)+"\n",encoding="utf-8")
          print("NATIVE_EDITOR_GATE_STATUS",json.dumps(result,sort_keys=True))
          PY

      - name: Remove source PSD, extracted PNGs and generated ZIP from artifact scope
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/zombie-pistol.psd
          rm -f .test-output/clgb71-ik/original-ik-spine-4.3.26.zip
          rm -rf .test-output/clgb71-ik/package/images
          rm -f .test-output/clgb71-ik/original-layers.json
          if [ -n "${SPINE_CLI:-}" ] && [ -x "$SPINE_CLI" ]; then
            timeout 180 xvfb-run -a "$SPINE_CLI" -l >/dev/null 2>&1 || true
          fi
          rm -rf "$RUNNER_TEMP/spine" "$RUNNER_TEMP/spine-linux.gz"
          rm -rf .test-output/clgb71-ik/package/images
          rm -rf .test-output/clgb71-ik/editor/source .test-output/clgb71-ik/editor/roundtrip
          rm -rf .test-output/clgb71-ik/editor/images .test-output/clgb71-ik/editor/screenshots
          rm -f .test-output/clgb71-ik/editor/clgb71-editor-4.3.26.spine
          rm -f .test-output/clgb71-ik/visual-evidence/source-psd-composite.png
          rm -f .test-output/clgb71-ik/visual-evidence/source-psd-recomputed-from-layers.png
          rm -f .test-output/clgb71-ik/visual-evidence/exported-layer-composite-approx.png
          rm -f .test-output/clgb71-ik/visual-evidence/source-vs-alpha-overlay-diff.png
          echo "Source PSD, original PNGs, ZIP, Editor project and screenshots removed from runner workspace."

      - name: Upload non-pixel integrity and diagnostic reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clgb71-public-psd-spine-runtime-reports
          path: |
            results/clgb71-source-summary.json
            .test-output/clgb71-ik/psd-extraction-receipt.json
            .test-output/clgb71-ik/rig-runtime-report.json
            .test-output/clgb71-ik/ik-package-report.json
            .test-output/clgb71-ik/runtime-contact-poses.json
            .test-output/clgb71-ik/attachment-contact-report.json
            .test-output/clgb71-ik/visual-evidence/fidelity-report.json
            .test-output/clgb71-ik/visual-evidence/psd-effect-footprints.json
            .test-output/clgb71-ik/visual-evidence/source-psd-compositing-profile.json
            .test-output/clgb71-ik/visual-evidence/source-psd-color-resources.json
            .test-output/clgb71-ik/native-editor-status.json
            .test-output/clgb71-ik/editor/editor-roundtrip-report.json
            .test-output/clgb71-ik/editor/psd-editor-color-evidence.json
          if-no-files-found: warn
          retention-days: 7
