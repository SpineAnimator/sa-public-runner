name: Spine Saver public executor contract
on:
  push:
    branches: [main]
    paths:
      - 'tests/test_saver_public_executor_contract.py'
      - '.github/workflows/3spine-saver-selftest.yml'
      - '.github/workflows/3spine-saver-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    name: Verify saver workflow contract and YAML on Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run saver public executor regression tests
        run: python -m unittest discover -s tests -p test_saver_public_executor_contract.py -v
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: false
      - name: Lint reusable saver workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/3spine-saver-selftest.yml .github/workflows/3spine-saver-contract.yml
