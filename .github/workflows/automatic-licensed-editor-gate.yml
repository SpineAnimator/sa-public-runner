name: Automatic licensed Spine Editor readiness and native gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/automatic-licensed-editor-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: automatic-licensed-editor-readiness
  cancel-in-progress: false
jobs:
  readiness:
    name: Check licensed Editor credentials without exposing values
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      ready: ${{ steps.probe.outputs.ready }}
    steps:
      - name: Check out public runner contract
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Probe required secrets safely
        id: probe
        shell: bash
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          SPINE_LICENSE: ${{ secrets.SPINE_LICENSE }}
          SPINE_LINUX_URL: ${{ secrets.SPINE_LINUX_URL }}
        run: bash scripts/check-licensed-editor-secrets.sh
  native-editor:
    name: Licensed CLGB71 import/export on public Ubuntu 24.04
    needs: readiness
    if: needs.readiness.outputs.ready == 'true'
    uses: ./.github/workflows/3spine-clgb71-licensed-editor.yml
    with:
      artifact_run_id: ''
      expected_source_sha: ''
    secrets:
      SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
      SPINE_LICENSE: ${{ secrets.SPINE_LICENSE }}
      SPINE_LINUX_URL: ${{ secrets.SPINE_LINUX_URL }}
