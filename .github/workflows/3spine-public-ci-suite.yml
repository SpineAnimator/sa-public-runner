name: 3Spine public CI suite
on:
  workflow_call:
    secrets:
      SOURCE_REPO_TOKEN:
        required: true
permissions:
  contents: read
  actions: read
jobs:
  python-regressions:
    name: Python visual, PSD, geometry and archive regressions • public Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout private 3Spine source
        uses: actions/checkout@v4
        with:
          repository: vladleopold/3Spine-core
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic image-test dependency
        run: python -m pip install --disable-pip-version-check 'Pillow>=10.3,<14'
      - name: Compile Python validators and repair tools
        run: python3 -m py_compile .codespace/pg-extractor/make_previews_index.py .codespace/compile_block.py scripts/repair_conversion_zip.py scripts/guard_spine_contacts.py scripts/emit_runtime_contact_masks.py tests/test_playson_previews.py tests/test_repair_conversion_zip.py tests/test_guard_spine_contacts.py tests/test_emit_runtime_contact_masks.py
      - name: Run 360 visual regressions
        run: python -m unittest discover -s tests -p 'test_audit_volume360_*.py' -v
      - name: Run native PSD color parity regressions
        run: python -m unittest discover -s tests -p test_audit_psd_editor_color.py -v
      - name: Run PlaysOn preview and historical ZIP repair regressions
        run: |
          python3 -m unittest discover -s tests -p test_playson_previews.py -v
          python3 -m unittest discover -s tests -p test_repair_conversion_zip.py -v
          python3 -m unittest discover -s tests -p test_legacy_editor_workers.py -v
      - name: Run geometry and runtime contact-mask regressions
        run: |
          python3 -m unittest discover -s tests -p test_guard_spine_contacts.py -v
          python3 -m unittest discover -s tests -p test_emit_runtime_contact_masks.py -v
      - name: Run selected native frame manifest regressions
        run: python -m unittest discover -s tests -p test_create_native_frame_manifest.py -v

  browser-download-e2e:
    name: History preview download browser E2E • public Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout private 3Spine source
        uses: actions/checkout@v4
        with:
          repository: vladleopold/3Spine-core
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned browser dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check browser and worker JavaScript syntax
        run: |
          node --check frontend/js/app.js
          node --check worker/src/index.js
      - name: Test broker download contract
        run: node scripts/test_history_broker_download.mjs
      - name: Launch static UI and wait for HTTP readiness
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory frontend > "$RUNNER_TEMP/preview-site.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/preview-site.pid"
          for attempt in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:4173/preview.html >/dev/null; then
              echo "PREVIEW_SITE_READY"
              exit 0
            fi
            if (( attempt == 100 )); then
              cat "$RUNNER_TEMP/preview-site.log"
              exit 1
            fi
            sleep .2
          done
      - name: Test actual history preview downloads in Chromium
        run: node scripts/test_history_preview_downloads.mjs
      - name: Stop local preview server
        if: always()
        run: if [ -f "$RUNNER_TEMP/preview-site.pid" ]; then kill "$(cat "$RUNNER_TEMP/preview-site.pid")" || true; fi

  converter-static-assets:
    name: Converter static assets and Wrangler dry-run • public Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout private 3Spine source
        uses: actions/checkout@v4
        with:
          repository: vladleopold/3Spine-core
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate required static assets and reject embedded secrets
        shell: bash
        run: |
          set -euo pipefail
          test -s frontend/index.html
          test -s frontend/preview.html
          test -s frontend/js/app.js
          test -s frontend/css/style.css
          test -s frontend/js/spine-player.js
          test -s frontend/js/jszip.min.js
          test -s frontend/vendor/spine-canvas-3.7.js
          test -s frontend/vendor/spine-canvas-4.3.13.js
          if find frontend -type f | grep -Ev '\\.(html|css|js|png)$'; then exit 1; fi
          if grep -Ei 'github_pat_|ghp_[A-Za-z0-9]{20}|BEGIN .*PRIVATE KEY|SPINE_LICENSE|CLOUDFLARE_API_TOKEN' frontend/index.html frontend/preview.html frontend/js/app.js; then
            echo '::error::Possible secret embedded in public frontend assets'
            exit 1
          fi
      - name: Install dependencies and validate Wrangler dry-run
        run: |
          npm ci
          npx --yes wrangler@latest deploy --dry-run --outdir "$RUNNER_TEMP/dryrun"
          test -d "$RUNNER_TEMP/dryrun"
          echo "ASSETS_DRYRUN_OK"

  spine-mask-gateway-unit:
    name: Spine Mask Native Gateway auth regression tests • public Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout private 3Spine source
        uses: actions/checkout@v4
        with:
          repository: vladleopold/3Spine-core
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test private gateway auth retry and session security
        run: node --test tests/spine-mask-v2-gateway.test.mjs

  public-site-health:
    name: Public SpineAnimator site and archive API health • public Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify deployed public site, app JavaScript and archive API
        shell: bash
        env:
          SITE: https://spineanimator.github.io
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --retry-all-errors --max-time 15 "$SITE/" -o "$RUNNER_TEMP/index.html"
          grep -Fq '<title>SPINE ANIMATOR</title>' "$RUNNER_TEMP/index.html"
          grep -Eq 'src="./app\\.js(\\?[^"]*)?"' "$RUNNER_TEMP/index.html"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --retry-all-errors --max-time 15 "$SITE/app.js" -o "$RUNNER_TEMP/app.js"
          node --check "$RUNNER_TEMP/app.js"
          grep -Fq "const STUDIO = 'https://spine-studio.spine-animator-f8692224.workers.dev';" "$RUNNER_TEMP/app.js"
          grep -Fq "const EXPORTER = 'https://spine-generator.spine-animator-f8692224.workers.dev';" "$RUNNER_TEMP/app.js"
          archive="$(curl --fail --silent --show-error --max-time 15 'https://spine-archive.spine-animator-f8692224.workers.dev/api/health')"
          jq -e '.ok == true' <<<"$archive" >/dev/null

  saver-npm-selftest:
    name: Spine saver Node regression suite • public Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout private 3Spine source
        uses: actions/checkout@v4
        with:
          repository: vladleopold/3Spine-core
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and Chrome
        run: |
          npm ci
          bash scripts/install-chrome-linux.sh
          echo "CHROME_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
      - name: Run Node saver self-tests
        run: npm test
