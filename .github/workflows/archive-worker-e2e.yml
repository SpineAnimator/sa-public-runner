name: Archive Worker synthetic upload/download SHA gate (provider diagnostics)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-worker-e2e.yml'
      - 'tests/live-archive-upload.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: archive-worker-live-e2e
  cancel-in-progress: true
jobs:
  live-upload-download:
    name: Synthetic PSD transport smoke (no source artwork)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upload synthetic PSD, download production URL, compare SHA-256
        env:
          SA_ARCHIVE_API_URL: https://spine-archive.spine-animator-f8692224.workers.dev
        run: node tests/live-archive-upload.mjs
      - name: Check Catbox API reachability from runner (read-only)
        run: |
          node --input-type=module - <<'NODE'
          try {
            const response = await fetch('https://catbox.moe/user/api.php', { signal: AbortSignal.timeout(10000) });
            console.log(JSON.stringify({ reachable: true, status: response.status, server: response.headers.get('server') }));
            await response.body?.cancel();
          } catch (error) {
            console.log(JSON.stringify({ reachable: false, error: error?.name || 'NetworkError' }));
          }
          NODE
      - name: State test scope
        run: echo "::notice::This proves HTTP upload/download byte integrity only; it does not prove real PSD/PSB parsing, Photoshop export, private GitHub storage, or Spine Editor import."
