name: Public Ubuntu executor | spine link full cloud e2e
on:
  workflow_call:
    secrets:
      SOURCE_REPO_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  site-to-licensed-editor:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 3spine
    timeout-minutes: 25
    steps:
      - name: Checkout private 3Spine source
        uses: actions/checkout@v4
        with:
          repository: vladleopold/3Spine-core
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: 3spine
          persist-credentials: false
      - name: Checkout official public Spine runtimes project
        uses: actions/checkout@v4
        with:
          repository: EsotericSoftware/spine-runtimes
          ref: '4.3'
          path: 3spine/official
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            examples/spineboy/spineboy-ess.spine
            examples/spineboy/images
            examples/spineboy/license.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated Chromium for visual playback gate
        run: |
          npm install --no-save playwright@1.59.1
          sudo apt-get update -qq
          npx playwright install chromium
          node -e "require('playwright').chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-dev-shm-usage']}).then(b=>b.close())"
      - name: Real project upload, native export, Chromium motion, cleanup
        run: node scripts/spine-link-full-cloud-e2e.mjs
