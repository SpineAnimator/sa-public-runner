      - name: Assemble source and first / middle / last of both complete clips
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import math
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          source = Image.open('work/fidelity/source-psd-composite.png').convert('RGBA')
          root = Path('work/editor/screenshots')
          coverage = json.loads(Path('work/editor/editor-roundtrip-report.json').read_text())['full_animation_frame_coverage']
          destinations = [('Original approved PSD', source)]
          for clip in ('shoot_up_01', 'shoot_up_02'):
              frames = sorted((root / clip).rglob('*.png'))
              required = coverage[clip]['expected_min_frames']
              if len(frames) < required or len(frames) < 3:
                  raise SystemExit(f'Incomplete {clip}: {len(frames)} < {required}')
              for label, index in (('start', 0), ('middle', len(frames)//2), ('end', -1)):
                  destinations.append((f'{clip}: {label}', Image.open(frames[index]).convert('RGBA')))
          w, h, top, cols = 600, 490, 40, 3
          rows = math.ceil(len(destinations)/cols)
          sheet = Image.new('RGB', (w * cols, (h + top) * rows), '#343741')
          draw = ImageDraw.Draw(sheet)
          for i, (label, im) in enumerate(destinations):
              cell_x = (i % cols) * w
              cell_y = (i // cols) * (h + top)
              view = ImageOps.contain(im, (w - 24, h - 24))
              bg = Image.new('RGBA', view.size, '#343741')
              bg.alpha_composite(view)
              sheet.paste(bg.convert('RGB'), (cell_x + (w-view.width)//2, cell_y + top+(h-view.height)//2))
              draw.text((cell_x+12, cell_y+14), label, fill='white')
          sheet.save('work/editor/visual-review-side-by-side.png')
          PY

