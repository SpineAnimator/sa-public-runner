name: 2Spine approved PSD - licensed Spine Editor 4.3.26 Linux gate
# Source QA pulse 2026-11-23: one-shot pinned verification of trusted source PR artifact 44793442612

on:
  workflow_call:
    inputs:
      artifact_run_id:
        required: false
        type: string
        default: ''
      expected_source_sha:
        required: false
        type: string
        default: ''
    secrets:
      SOURCE_REPO_TOKEN:
        required: true
      SPINE_LICENSE:
        required: true
      SPINE_LINUX_URL:
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: licensed-spine43-3spine-core
  cancel-in-progress: false

jobs:
  native-editor:
    # Licensed Editor credentials are never exposed to pull_request code,
    # including same-repository PR branches. Use trusted dispatch/manual runs.
    if: ${{ github.event_name != 'pull_request' &&
      (github.event_name != 'repository_dispatch' ||
       (github.event.sender.login == 'vladleopold' && github.event.client_payload.source_repo == 'SpineAnimator/spine-animator-private')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: 3spine
    env:
      SOURCE_REPO: SpineAnimator/spine-animator-private
      # One-time push marker lets this exact main commit exercise the already-verified
      # private source PR artifact without relying on a mutable "latest main" selector.
      SOURCE_RUN: "${{ inputs.artifact_run_id || github.event.client_payload.artifact_run_id || (github.event_name == 'push' && github.event.head_commit.message == '2spine-clgb71-pin-source-44793442612' && '44793442612') || '' }}"
      EXPECTED_SOURCE_SHA: "${{ inputs.expected_source_sha || github.event.client_payload.expected_source_sha || (github.event_name == 'push' && github.event.head_commit.message == '2spine-clgb71-pin-source-44793442612' && '22c122b6eceb97e817c0d89200ec3df45824b3a0') || '' }}"
      SPINE_LICENSE: ${{ secrets.SPINE_LICENSE }}
      SPINE_LINUX_URL: ${{ secrets.SPINE_LINUX_URL }}
    steps:
      - name: Checkout trusted 3Spine source on the public executor
        uses: actions/checkout@v4
        with:
          repository: vladleopold/3Spine-core
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: 3spine
          persist-credentials: false

      - name: Pin exact 3Spine source revision
        run: echo "THREESPINE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Check out official-source validation tooling
        uses: actions/checkout@v4
        with:
          repository: SpineAnimator/spine-animator-private
          ref: main
          path: source-validation
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false

      - name: Require licensed launcher configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SPINE_LICENSE" || { echo "::error::SPINE_LICENSE unavailable for this repository"; exit 1; }
          test -n "$SPINE_LINUX_URL" || { echo "::error::SPINE_LINUX_URL unavailable for this repository"; exit 1; }
          mkdir -p work/editor

      - name: Regression-test source dependency freshness before selecting ZIP
        run: python3 -m unittest discover -s tests -p 'test_guard_clgb71_build_inputs.py'

      - name: Download exact previously validated ZIP artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "::error::ACCESS_TOKEN unavailable for cross-repository artifact access"; exit 1; }
          # On a manual dispatch a run id may be supplied; otherwise discover fresh
          # validated pipeline runs and pin the exact approved inner ZIP SHA.
          # The regenerated ZIP changes hash after mesh fixes.
          # Accept successful main artifacts or explicitly pinned same-repo PR artifacts.
          # PR builds never receive editor credentials; only this trusted workflow does.
          if [ -n "$SOURCE_RUN" ]; then
            RUN_IDS="$SOURCE_RUN"
          else
            # Prioritize the dedicated, freshly-built IK archive. The zombie
            # workflow is only the fallback; never silently validate stale art.
            RUN_IDS=$(
              gh api "repos/$SOURCE_REPO/actions/workflows/clgb71-original-ik-zip.yml/runs?status=success&branch=main&per_page=20" \
                --jq '.workflow_runs[].id'
              gh api "repos/$SOURCE_REPO/actions/workflows/zombie-spine-e2e.yml/runs?status=success&branch=main&per_page=20" \
                --jq '.workflow_runs[].id'
            )
          fi
          test -n "$RUN_IDS" || { echo "::error::No recent successful source workflow runs"; exit 1; }
          mkdir -p work/input
          FOUND=0
          while read -r RUN_ID; do
            [ -n "$RUN_ID" ] || continue
            ID=$(gh api "repos/$SOURCE_REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name == "clgb71-original-38layer-ik-spine-json-zip" and .expired == false)] | last | .id' || true)
            # Treat source ZIP as untrusted data: this job executes only 3Spine
            # trusted scripts and source-validation/main, never candidate code.
            RUN_JSON=$(gh api "repos/$SOURCE_REPO/actions/runs/$RUN_ID")
            if ! printf '%s' "$RUN_JSON" | jq -e --arg repo "$SOURCE_REPO" --arg sha "$EXPECTED_SOURCE_SHA" --arg explicit "$SOURCE_RUN" '
              .conclusion == "success" and
              .repository.full_name == $repo and
              (.path | contains("/clgb71-original-ik-zip.yml")) and
              (
                (.head_branch == "main" and (.event == "push" or .event == "workflow_dispatch") and $sha == "")
                or
                ($explicit != "" and $sha != "" and (.head_sha == $sha) and
                 (.event == "pull_request") and
                 (.head_repository.full_name == $repo))
                or
                ($explicit != "" and $sha != "" and (.head_sha == $sha) and
                 (.head_branch == "main") and
                 (.event == "push" or .event == "workflow_dispatch"))
              )
            ' >/dev/null; then
              echo "::warning::Rejecting run $RUN_ID: untrusted provenance, SHA or workflow"
              continue
            fi
            # No stale source ZIP may masquerade as proof of a newer
            # clgb71 rig / animation generator. Allow docs-only main commits
            # after the source run, but reject *any* generator/workflow change.
            # Explicit PR art candidates are already bound to head SHA above.
            if [ -z "$SOURCE_RUN" ]; then
              RUN_HEAD_SHA="$(jq -r '.head_sha' <<< "$RUN_JSON")"
              LIVE_MAIN_SHA="$(gh api "repos/$SOURCE_REPO/branches/main" --jq '.commit.sha')"
              if [ "$RUN_HEAD_SHA" != "$LIVE_MAIN_SHA" ]; then
                if ! DIFF_JSON="$(gh api "repos/$SOURCE_REPO/compare/$RUN_HEAD_SHA...$LIVE_MAIN_SHA")"; then
                  echo "::warning::Cannot prove artifact source ancestry, rejecting run $RUN_ID"
                  continue
                fi
                if ! jq -e '.status == "ahead" or .status == "identical"' <<< "$DIFF_JSON" >/dev/null; then
                  echo "::warning::Source run diverged from current main, rejecting run $RUN_ID"
                  continue
                fi
                # Check the real clgb71 source-build dependency set,
                # not unrelated Cherry 360 geometry/Cloudflare/Rust changes.
                # Reject missing compare data, renamed build inputs, and stale
                # rig, PSD reader, Node dependencies, or ZIP packager changes.
                if ! python3 scripts/guard_clgb71_build_inputs.py <<< "$DIFF_JSON"; then
                  echo "::warning::Actual clgb71 build inputs changed after source run $RUN_ID; rejecting stale archive"
                  continue
                fi
              fi
            fi
            rm -rf work/input/* work/input-artifact.zip
            SOURCE_POINTER="$ID"
            if [ -n "$ID" ] && [ "$ID" != "null" ]; then
              if ! curl --fail --location --silent --show-error --retry 2 --max-time 180 \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$SOURCE_REPO/actions/artifacts/$ID/zip" \
                -o work/input-artifact.zip; then continue; fi
              if ! unzip -t work/input-artifact.zip >/dev/null; then continue; fi
              unzip -q work/input-artifact.zip -d work/input
            else
              # The primary source workflow can succeed while upload-artifact
              # fails with the repository quota. Only a private, exact-run
              # DRAFT Release from trusted main may provide replacement bytes.
              if [ "$(jq -r '.head_branch' <<< "$RUN_JSON")" != main ]; then continue; fi
              [[ "$RUN_ID" =~ ^[0-9]{8,20}$ ]] || continue
              ATTEMPT="$(jq -r '.run_attempt' <<< "$RUN_JSON")"
              [[ "$ATTEMPT" =~ ^[0-9]+$ ]] || continue
              TAG="evidence/clgb71-source/${RUN_ID}-attempt-${ATTEMPT}"
              PRIVATE="$(gh api "repos/$SOURCE_REPO" --jq .private)"
              if [ "$PRIVATE" != true ]; then
                echo "::error::Refusing original source ZIP download from public Release"
                exit 1
              fi
              RELEASES="$(gh api "repos/$SOURCE_REPO/releases?per_page=100")"
              RELEASE="$(jq -c --arg tag "$TAG" '[.[] | select(.tag_name==$tag and .draft==true)] | first // null' <<< "$RELEASES")"
              if [ "$RELEASE" = null ]; then
                echo "::warning::No trusted private fallback for source run $RUN_ID"
                continue
              fi
              # Bind the private draft to the EXACT successful source commit.
              SOURCE_HEAD="$(jq -r '.head_sha' <<< "$RUN_JSON")"
              if ! jq -e --arg sha "$SOURCE_HEAD" '.target_commitish == $sha' <<< "$RELEASE" >/dev/null; then
                echo "::warning::Private source draft does not match trusted run commit"
                continue
              fi
              # Reject ambiguous or unpinned asset names.
              ZIP_ASSET="$(jq -r '[.assets[] | select(.name=="original-ik-spine-4.3.26.zip")] | if length==1 then .[0].id else empty end' <<< "$RELEASE")"
              RECEIPT_ASSET="$(jq -r '[.assets[] | select(.name=="ik-package-report.json")] | if length==1 then .[0].id else empty end' <<< "$RELEASE")"
              [[ "$ZIP_ASSET" =~ ^[0-9]+$ && "$RECEIPT_ASSET" =~ ^[0-9]+$ ]] || continue
              if ! gh api -H 'Accept: application/octet-stream' \
                "repos/$SOURCE_REPO/releases/assets/$ZIP_ASSET" > work/input/original-ik-spine-4.3.26.zip; then continue; fi
              if ! gh api -H 'Accept: application/octet-stream' \
                "repos/$SOURCE_REPO/releases/assets/$RECEIPT_ASSET" > work/input/ik-package-report.json; then continue; fi
              SOURCE_POINTER="private-draft:${TAG}"
              echo "VERIFIED_PRIVATE_SOURCE_FALLBACK ${TAG}"
            fi
            ZIP="work/input/original-ik-spine-4.3.26.zip"
            RECEIPT="work/input/ik-package-report.json"
            if [ -f "$ZIP" ] && [ -f "$RECEIPT" ] && python3 - "$ZIP" "$RECEIPT" <<'PY'
          import hashlib, json, pathlib, sys, zipfile
          archive, report = map(pathlib.Path, sys.argv[1:])
          receipt = json.loads(report.read_text(encoding='utf-8'))
          expected_source = '7adee866547a3b3cc9838b655cf70865980c5dba00313373cbf903fed776c7b2'
          assert receipt.get('source_sha256') == expected_source
          assert receipt.get('export_version') == '4.3.26'
          assert receipt.get('visible_source_layers') == 38
          assert receipt.get('png_count') == 38
          assert receipt.get('actual_ik_constraints') == 2
          assert set(receipt.get('animations', [])) == {'shoot_up_01', 'shoot_up_02'}
          assert receipt.get('zip_sha256') == hashlib.sha256(archive.read_bytes()).hexdigest()
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              assert len(z.namelist()) == len(set(z.namelist())) == 40
          print('Pinned source ZIP receipt and CRC match')
          PY
            then
              FOUND=1
              echo "SOURCE_ARTIFACT_ID=$SOURCE_POINTER" >> "$GITHUB_ENV"
              echo "SOURCE_RUN_SELECTED=$RUN_ID" >> "$GITHUB_ENV"
              echo "Verified source run: $RUN_ID, evidence: $SOURCE_POINTER"
              break
            fi
          done <<< "$RUN_IDS"
          test "$FOUND" = 1 || { echo "::error::No approved, unexpired ZIP with pinned SHA-256"; exit 1; }

      - name: Install actual licensed Spine Linux launcher and Xvfb
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(id -u)" -eq 0 ]; then
            APT=apt-get
          else
            APT="sudo apt-get"
          fi
          $APT update -qq
          $APT install -y xvfb x11-utils x11-xserver-utils libxrandr2 libgl1-mesa-dri libgl1 libxrender1 libxi6 libxext6 libxfixes3 libxcursor1
          # Existing 3Spine workflow uses the same licensed Linux archive secret.
          curl --fail --location --silent --show-error --max-time 600 --retry 2 \
            -A "Mozilla/5.0 (X11; Linux x86_64)" \
            "$SPINE_LINUX_URL" -o "$RUNNER_TEMP/spine-linux.gz"
          gzip -t "$RUNNER_TEMP/spine-linux.gz"
          mkdir -p "$RUNNER_TEMP/spine"
          gzip -dc "$RUNNER_TEMP/spine-linux.gz" | tar -xf - -C "$RUNNER_TEMP/spine"
          SPINE_SCRIPT="$RUNNER_TEMP/spine/Spine/Spine.sh"
          test -x "$SPINE_SCRIPT" || { echo "::error::Spine.sh missing from licensed archive"; exit 1; }
          echo "SPINE_CLI=$SPINE_SCRIPT" >> "$GITHUB_ENV"

      - name: Install fidelity and image dependencies
        shell: bash
        run: python3 -m pip install --quiet 'psd-tools[composite]>=1.10,<2' 'Pillow>=10.3,<14' 'numpy>=1.26,<3'

      - name: Compile native RGB feedback code before licensed runtime starts
        run: python3 -m py_compile scripts/calibrate_clgb71_native_rgb.py

      - name: Test full-animation render duration and reject invalid key times
        run: python3 -m unittest discover -s tests -p 'test_editor_animation_coverage.py'

      - name: Verify exit-145 is allowed only with full, nonblank official PNG evidence
        run: python3 -m unittest discover -s tests -p 'test_spine_editor_png_exit145.py'

      - name: Unit-test RGB-only candidate ZIP immutability and alpha protection
        run: python3 -m unittest discover -s tests -p 'test_build_clgb71_rgb_candidate_zip.py'

      - name: Import ZIP in actual Spine Editor 4.3.26, reopen and render PNGs
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1600x1000x24' \
            python3 scripts/verify_clgb71_editor_linux.py \
              --archive work/input/original-ik-spine-4.3.26.zip \
              --spine "$SPINE_CLI" \
              --package-report work/input/ik-package-report.json \
              --output work/editor

      - name: Re-download original PSD with full pinned hash, then compare all 38 layers
        shell: bash
        env:
          PSD_TEMP_FILE: ${{ github.workspace }}/work/source.psd
        run: |
          set -euo pipefail
          python3 source-validation/tools/verify_zombie_psd.py
          mkdir -p work/fidelity
          python3 source-validation/tools/verify_clgb71_fidelity.py \
            work/source.psd work/input/original-ik-spine-4.3.26.zip work/fidelity
          python3 source-validation/tools/audit_spine43_candidate.py \
            work/source.psd work/input/original-ik-spine-4.3.26.zip work/fidelity/candidate-audit.json

      - name: Inspect source Photoshop blend/group stack without altering original pixels
        shell: bash
        run: |
          python3 - <<'PY'
          import collections, json
          from pathlib import Path
          profile = json.loads(Path('work/fidelity/source-psd-compositing-profile.json').read_text(encoding='utf-8'))
          assert profile['schema'] == 'clgb71.source-psd-compositing.v1'
          layers = profile['layers']
          assert len(layers) == 38, 'Expected 38 original visible Photoshop layers'
          blends = dict(sorted(collections.Counter(layer['blend_mode'] for layer in layers).items()))
          group_blends = dict(sorted(collections.Counter(
              group['blend_mode'] for layer in layers
              for group in layer['ancestor_groups']).items()))
          group_opacity = sorted(set(str(group['opacity'])
              for layer in layers for group in layer['ancestor_groups']))
          summary = {
              'layer_blends': blends,
              'ancestor_group_blends': group_blends,
              'ancestor_group_opacities': group_opacity,
              'clipped_leaf_count': sum(bool(layer['clipping']) for layer in layers),
              'masked_leaf_count': sum(bool(layer['has_mask']) for layer in layers),
              'non_default_leaf_opacity_count': sum(layer['opacity'] not in (255, None) for layer in layers),
              'unsupported_slot_blend_count': len(profile['unsupported_psd_blend_layers']),
              'photoshop_effect_reproduction_needed_count':
                  len(profile['unsupported_photoshop_compositing_layers']),
              'photoshop_effect_layers':
                  profile['unsupported_photoshop_compositing_layers'],
              'render_parity_proven': False,
          }
          print('SOURCE_PHOTOSHOP_COMPOSITING_METADATA', json.dumps(summary, sort_keys=True))
          PY

      - name: Audit original Photoshop shadow locality and opaque RGB divergence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          profile = json.loads(Path('work/fidelity/source-psd-compositing-profile.json').read_text())
          effect = json.loads(Path('work/fidelity/psd-effect-footprints.json').read_text())
          assert effect['schema'] == 'clgb71.photoshop-effect-locality.v1'
          assert set(profile['unsupported_photoshop_compositing_layers']) == {
              'card-2', 'card-5', 'card-7', 'card-9'}
          assert len(effect['effect_regions']) == 4
          assert all(e['shadow_parameters'] for e in effect['effect_regions'])
          assert effect['shadow_causality_proven'] is False
          assert effect['photoshop_parity_proven'] is False
          assert 0 <= effect['outside_share_of_total_rgb_error'] <= 1
          assert effect['outside_fully_opaque_pixels'] > 100
          assert effect['outside_fully_opaque_rgb_mae_255'] is not None
          assert effect['top_outside_shadow_hotspots']
          print('SOURCE_PSD_EFFECT_LOCALITY', json.dumps({
              'effect_regions': len(effect['effect_regions']),
              'outside_rgb_error_share': effect['outside_share_of_total_rgb_error'],
              'opaque_non_shadow_rgb_mae': effect['outside_fully_opaque_rgb_mae_255'],
              'top_spatial_hotspots': effect['top_outside_shadow_hotspots'][:3],
              'photoshop_parity_proven': False,
              'artistic_quality_approved': False,
          }, sort_keys=True))
          PY

      - name: Preserve read-only source ICC metadata before native art review
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          path = Path('work/fidelity/source-psd-color-resources.json')
          doc = json.loads(path.read_text(encoding='utf-8'))
          assert doc['schema'] == 'clgb71.source-psd-color-resources.v1'
          assert doc['has_saved_merged_preview'] is True
          assert doc['icc_transform_causality_proven'] is False
          assert doc['saved_preview_color_truth_approved'] is False
          if doc['has_embedded_icc_profile']:
              assert doc['icc_profile_bytes'] > 0
              assert re.fullmatch(r'[0-9a-f]{64}', doc['icc_profile_sha256'])
          else:
              assert doc['icc_profile_bytes'] == 0 and doc['icc_profile_sha256'] is None
          print('PSD_COLOR_RESOURCES', json.dumps({
              'mode': doc['color_mode'], 'depth': doc['bit_depth'],
              'embedded_icc': doc['has_embedded_icc_profile'],
              'icc_sha256': doc['icc_profile_sha256'],
              'artist_approved': False}, sort_keys=True))
          PY

      - name: Unit-test PSD versus genuine Spine Editor RGB parity
        run: python3 -m unittest discover -s tests -p 'test_audit_psd_editor_color.py'

      - name: Audit Photoshop composite versus real native Editor rest frames
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_psd_editor_color.py \
            --psd-composite work/fidelity/source-psd-composite.png \
            --layer-composite work/fidelity/exported-layer-composite-approx.png \
            --forced-recomposite work/fidelity/source-psd-recomputed-from-layers.png \
            --editor-screenshots work/editor/screenshots \
            --output work/editor/psd-editor-color-evidence.json
          # Never silently convert an RGB mismatch into artistic approval.
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('work/editor/psd-editor-color-evidence.json').read_text())
          assert report['status'] in {'PASS_COLOR_COMPOSITE_PARITY', 'BLOCK_ARTISTIC_COLOR_FIDELITY'}
          assert report['artistic_quality_approved'] is False and report['release_ready'] is False
          print('ARTISTIC_COLOR_GATE', report['status'])
          assert report.get('color_divergence_triage') is not None
          assert report['color_divergence_triage']['root_cause_proven'] is False
          split = report['color_divergence_triage']['source_reference_split']
          assert split['root_cause_proven'] is False
          print('COLOR_STAGE_TRIAGE', report['color_divergence_triage']['dominant_measured_mismatch_stage'])
          print('UNRESOLVED_PSD_COLOR_REFERENCE', split['source_reference_conflict_unresolved'])
          PY

      - name: Regenerate Photoshop RGB candidate on trusted runner from exact original PSD and ZIP
        shell: bash
        run: |
          set -euo pipefail
          # Avoid dependence on GitHub Actions artifact storage quota for the
          # derived textures. The only input PNGs are from the verified archive.
          python3 source-validation/tools/reconstruct_psd_rgb_appearance.py \
            work/source.psd \
            work/editor/source/images \
            work/input/psd-rgb-candidate

      - name: Bind Photoshop RGB-corrected PNGs to exact original ZIP without changing source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_clgb71_rgb_candidate_zip.py \
            --source work/input/original-ik-spine-4.3.26.zip \
            --receipt work/input/ik-package-report.json \
            --images work/input/psd-rgb-candidate/derived-images \
            --color-report work/input/psd-rgb-candidate/color-inversion-report.json \
            --output work/rgb-candidate/clgb71-rgb-candidate.zip \
            --output-receipt work/rgb-candidate/ik-package-rgb-candidate-report.json

      - name: Import corrected RGB candidate in LICENSED Editor 4.3.26 and render both complete clips
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1600x1000x24' \
            python3 scripts/verify_clgb71_editor_linux.py \
              --archive work/rgb-candidate/clgb71-rgb-candidate.zip \
              --package-report work/rgb-candidate/ik-package-rgb-candidate-report.json \
              --spine "$SPINE_CLI" \
              --output work/rgb-editor

      - name: Compare REAL corrected Editor PNGs against saved Photoshop composite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_psd_editor_color.py \
            --psd-composite work/fidelity/source-psd-composite.png \
            --layer-composite work/fidelity/exported-layer-composite-approx.png \
            --forced-recomposite work/fidelity/source-psd-recomputed-from-layers.png \
            --editor-screenshots work/rgb-editor/screenshots \
            --output work/rgb-editor/psd-editor-rgb-candidate-parity.json
          python3 scripts/audit_clgb71_spine_render.py \
            --frames-dir work/rgb-editor/screenshots \
            --report work/rgb-editor/rgb-candidate-render-anomaly.json
          python3 scripts/audit_spine_pose_sequence.py \
            --frames-dir work/rgb-editor/screenshots \
            --report work/rgb-editor/rgb-candidate-motion-continuity.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          old=json.loads(Path('work/editor/psd-editor-color-evidence.json').read_text())
          new=json.loads(Path('work/rgb-editor/psd-editor-rgb-candidate-parity.json').read_text())
          native=json.loads(Path('work/rgb-editor/editor-roundtrip-report.json').read_text())
          candidate=json.loads(Path('work/input/psd-rgb-candidate/color-inversion-report.json').read_text())
          assert native['editor_import_verified'] and native['native_spine_project_verified']
          assert native['slots']==38 and native['ik_constraints']==2
          assert set(native['full_animation_frame_coverage'])=={'shoot_up_01','shoot_up_02'}
          assert all(v['rendered_frames']>=49 for v in native['full_animation_frame_coverage'].values())
          status={}
          for clip in ('shoot_up_01','shoot_up_02'):
              previous=old['clip_evidence'][clip]['start']
              actual=new['clip_evidence'][clip]['start']
              status[clip]={'original_editor_start_rgb_mae':previous['rgb_mae_255'],
                            'corrected_editor_start_rgb_mae':actual['rgb_mae_255'],
                            'alpha_mae':actual['alpha_mae_255'],
