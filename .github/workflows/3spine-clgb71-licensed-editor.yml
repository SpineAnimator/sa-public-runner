              for field, key in [
                  ('Saved PSD preview vs forced recomposition', 'saved_psd_preview_vs_forced_layer_recomposition'),
                  ('Forced recomposition vs extracted PNG overlay', 'forced_layer_recomposition_vs_extracted_png_overlay'),
              ]:
                  metric = split.get(key) or {}
                  summary.append(f"- {field}, RGB MAE: `{metric.get('rgb_mae_255', 'unknown')}`")
              summary.append(f"- Unresolved PSD preview/source conflict: `{split.get('source_reference_conflict_unresolved', 'unknown')}`")
          path = os.getenv('GITHUB_STEP_SUMMARY')
          if path:
              with open(path, 'a', encoding='utf-8') as output:
                  output.write('\n'.join(summary) + '\n')
          print('ARTISTIC_VERDICT_SUMMARY', json.dumps({
              'source_zip_sha256': source_hash,
              'editor_import_verified': reports.get('editor', {}).get('editor_import_verified', False),
              'color_status': reports.get('color', {}).get('status', 'NO_REPORT'),
              'selected_rgb_candidate': reports.get('rgb_feedback', {}).get('selected_candidate', 'NONE'),
              'feedback_rgb_gate': reports.get('rgb_feedback', {}).get('feedback_native_candidate_pass', False),
              'full_artistic_approval': False,
              'full_artifact_retained': 'NOT_YET_KNOWN',
          }, sort_keys=True))
          PY

      - name: Stage selected RGB native 98-frame evidence for normal Actions artifact
        # A recovered artifact quota must NOT silently omit the selected
        # feedback_2 frames. This is the same trusted selection as Draft Release.
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, shutil, zipfile
          from pathlib import Path
          verdict=json.loads(Path('work/rgb-feedback/final-verdict.json').read_text())
          selected=verdict['selected_candidate']
          paths={
              'initial': ('work/rgb-candidate/clgb71-rgb-candidate.zip',
                          'work/rgb-editor','psd-editor-rgb-candidate-parity.json'),
              'feedback': ('work/rgb-feedback/clgb71-feedback-candidate.zip',
                           'work/rgb-feedback/editor','psd-editor-feedback-parity.json'),
              'feedback_2': ('work/rgb-feedback-2/clgb71-feedback-candidate.zip',
                             'work/rgb-feedback-2/editor','psd-editor-feedback-parity.json'),
              'feedback_3': ('work/rgb-feedback-3/clgb71-feedback-candidate.zip',
                             'work/rgb-feedback-3/editor','psd-editor-feedback-parity.json'),
          }
          assert selected in paths and verdict['artistic_quality_approved'] is False
          assert verdict['release_ready'] is False
          archive_path, editor_path, parity_name=paths[selected]
          candidate=Path(archive_path)
          editor=Path(editor_path)
          report=editor/'editor-roundtrip-report.json'
          native=json.loads(report.read_text())
          digest=hashlib.sha256(candidate.read_bytes()).hexdigest()
          assert native.get('source_archive_sha256')==digest
          assert native.get('editor_import_verified') is True
          assert native.get('roundtrip_spine_version')=='4.3.26'
          assert native.get('slots')==38 and native.get('ik_constraints')==2
          frames=list((editor/'screenshots').rglob('*.png'))
          assert len(frames)==98
          for clip in ('shoot_up_01','shoot_up_02'):
              assert len(list((editor/'screenshots'/clip).glob('*.png')))==49
          out=Path('work/selected-rgb')
          shutil.copytree(editor/'screenshots',out/'screenshots')
          shutil.copy2(report,out/'editor-roundtrip-report.json')
          shutil.copy2(editor/parity_name,out/'psd-editor-parity.json')
          native_zip=Path('work/editor/clgb71-selected-licensed-rgb-candidate.zip')
          with zipfile.ZipFile(candidate) as src:
              assert src.testzip() is None
              names=src.namelist()
              assert len(names)==len(set(names))
              assert all(not name.startswith('/') and '..' not in Path(name).parts for name in names)
              assert len([name for name in names if name.startswith('images/') and name.endswith('.png')])==38
              additions={
                  'clgb71-editor-4.3.26.spine':(editor/'clgb71-editor-4.3.26.spine').read_bytes(),
                  'validation/licensed-selected-rgb-verdict.json':Path('work/rgb-feedback/final-verdict.json').read_bytes(),
                  'validation/licensed-selected-rgb-parity.json':(editor/parity_name).read_bytes(),
                  'validation/licensed-selected-editor-report.json':report.read_bytes(),
              }
              assert set(names).isdisjoint(additions)
              with zipfile.ZipFile(native_zip,'w',zipfile.ZIP_DEFLATED,compresslevel=7) as target:
                  for name in names:
                      target.writestr(name,src.read(name))
                  for name,contents in additions.items():
                      target.writestr(name,contents)
          with zipfile.ZipFile(native_zip) as proof:
              assert proof.testzip() is None
              assert len([x for x in proof.namelist() if x.startswith('images/') and x.endswith('.png')])==38
          selection={
              'selected_candidate':selected,
              'source_psd_sha256':verdict['photoshop_reference_sha256'],
              'selected_candidate_zip_sha256':digest,
              'selected_native_zip_sha256':hashlib.sha256(native_zip.read_bytes()).hexdigest(),
          }
          (out/'selection.json').write_text(json.dumps(selection,sort_keys=True)+'\n')
          print('SELECTED_NATIVE_RGB_STAGED',selected,len(frames),digest)
          PY

      - name: Pin every selected licensed Editor PNG byte before evidence publication
        env:
          NATIVE_RUN_ID: ${{ github.run_id }}
          NATIVE_HEAD_SHA: ${{ env.THREESPINE_SHA }}
        run: |
          set -euo pipefail
          python3 scripts/create_native_frame_manifest.py \
            --frames work/selected-rgb/screenshots \
            --manifest work/selected-rgb/selected-native-frame-sha256.json \
            --run-id "$NATIVE_RUN_ID" --head-sha "$NATIVE_HEAD_SHA"
          python3 scripts/create_native_frame_manifest.py \
            --frames work/selected-rgb/screenshots \
            --manifest work/selected-rgb/selected-native-frame-sha256.json --verify

      - name: Publish results and failure diagnostics without exporting credentials
        id: artifact_upload
        if: false # Private PSD, Spine projects and native PNGs must never become public artifacts.
        # Native evidence is stored only in the private 3Spine draft Release below.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: clgb71-licensed-spine-4-3-26-linux-evidence
          if-no-files-found: warn
          retention-days: 90
          path: |
            work/editor/clgb71-editor-4.3.26.spine
            work/editor/clgb71-spine-4.3.26-native-verified.zip
            work/editor/clgb71-selected-licensed-rgb-candidate.zip
            work/editor/corrected-original-ik-spine-4.3.26.zip
            work/editor/mesh-repair-report.json
            work/editor/roundtrip-nonessential.export.json
            work/editor/editor-roundtrip-report.json
            work/editor/attachment-contact-report.json
            work/editor/runtime-contact-poses.json
            work/editor/contact_masks/
            work/editor/visual-continuity-report.json
            work/editor/native-aim-report.json
            work/editor/render-anomaly-report.json
            work/editor/psd-editor-color-evidence.json
            work/editor/visual-review-side-by-side.png
            work/editor/art-review/artistic-evidence-report.json
            work/editor/art-review/artistic-review-contact-sheet.png
            work/editor/art-review/human-art-review-template.json
            work/editor/screenshots/
            work/selected-rgb/
            work/selected-rgb/selected-native-frame-sha256.json
            work/rgb-candidate/ik-package-rgb-candidate-report.json
            work/rgb-editor/editor-roundtrip-report.json
            work/rgb-editor/psd-editor-rgb-candidate-parity.json
            work/rgb-feedback/feedback-report.json
            work/rgb-feedback/clgb71-feedback-candidate.zip
            work/rgb-feedback/editor/clgb71-editor-4.3.26.spine
            work/rgb-feedback/editor/editor-roundtrip-report.json
            work/rgb-feedback/final-verdict.json
            work/rgb-feedback/editor/psd-editor-feedback-parity.json
            work/rgb-feedback/editor/screenshots/
            work/rgb-editor/rgb-candidate-final-verdict.json
            work/rgb-editor/rgb-candidate-render-anomaly.json
            work/rgb-editor/rgb-candidate-motion-continuity.json
            work/rgb-editor/screenshots/
