            work/fidelity/candidate-audit.json

      - name: Save entire native evidence in PRIVATE draft Release when Actions artifacts quota blocks upload
        id: private_draft_evidence
        if: ${{ always() && steps.native_zip.outcome == 'success' && steps.artifact_upload.outcome != 'success' && ((github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
        shell: bash
        env:
          # Existing CI credential is already used for cross-private-repo
          # read access. GitHub's job token cannot create Releases under
          # this private repository's enforced organisation policy (403).
          # Never print this secret or put it into any ZIP or log file.
          GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          GH_REPO: vladleopold/3Spine-core
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || {
            echo '::error::Private draft evidence requires an authorized CI credential'
            exit 1
          }
          # Fail closed: source PSD/Spine project and all PNGs must NEVER go
          # into a public release, even when the public site is deployed.
          [[ "$(gh api "repos/$GH_REPO" --jq .private)" == "true" ]] || {
            echo '::error::Refusing to publish native evidence outside a private repository'
            exit 1
          }
          export NATIVE_ZIP=work/editor/clgb71-spine-4.3.26-native-verified.zip
          export ALL_FRAME_EVIDENCE=work/editor/clgb71-native-allframes-evidence.zip
          export SELECTED_RGB_ZIP=work/editor/clgb71-selected-licensed-rgb-candidate.zip
          python3 - <<'PY'
          import hashlib,json,os,sys,zipfile
          from pathlib import Path
          original=Path(os.environ['NATIVE_ZIP'])
          assert original.is_file() and original.stat().st_size>0
          with zipfile.ZipFile(original) as archive:
              assert archive.testzip() is None
              members=archive.namelist()
              assert len([x for x in members if x.startswith('images/') and x.endswith('.png')])==38
              assert 'clgb71-editor-4.3.26.spine' in members
              editor=json.loads(archive.read('validation/editor-roundtrip-report.json'))
              art=json.loads(archive.read('validation/artistic-evidence-report.json'))
              assert editor.get('editor_import_verified') is True
              assert editor.get('artistic_quality_approved') is False
              assert art.get('artistic_quality_approved') is False
          rgb_verdict=json.loads(Path('work/rgb-feedback/final-verdict.json').read_text())
          selected=rgb_verdict['selected_candidate']
          assert selected in ('initial','feedback','feedback_2','feedback_3')
          assert rgb_verdict['artistic_quality_approved'] is False and rgb_verdict['release_ready'] is False
          if selected=='feedback_3':
              assert rgb_verdict['feedback_round_three_pass'] is True
              assert rgb_verdict['feedback_round_three_pixel_nonregression'] is True
              candidate=Path('work/rgb-feedback-3/clgb71-feedback-candidate.zip')
              editor=Path('work/rgb-feedback-3/editor')
              parity=editor/'psd-editor-feedback-parity.json'
          elif selected=='feedback_2':
              assert rgb_verdict['feedback_round_two_pass'] is True
              candidate=Path('work/rgb-feedback-2/clgb71-feedback-candidate.zip')
              editor=Path('work/rgb-feedback-2/editor')
              parity=editor/'psd-editor-feedback-parity.json'
          elif selected=='feedback':
              assert rgb_verdict['feedback_native_candidate_pass'] is True
              candidate=Path('work/rgb-feedback/clgb71-feedback-candidate.zip')
              editor=Path('work/rgb-feedback/editor')
              parity=editor/'psd-editor-feedback-parity.json'
          else:
              assert rgb_verdict['first_native_candidate_pass'] is True
              candidate=Path('work/rgb-candidate/clgb71-rgb-candidate.zip')
              editor=Path('work/rgb-editor')
              parity=editor/'psd-editor-rgb-candidate-parity.json'
          native=editor/'clgb71-editor-4.3.26.spine'
          native_report=editor/'editor-roundtrip-report.json'
          verification=json.loads(native_report.read_text())
          assert verification['editor_import_verified'] and verification['slots']==38 and verification['ik_constraints']==2
          assert len(verification['official_rendered_frames'])>=98
          selected_zip=Path(os.environ['SELECTED_RGB_ZIP'])
          assert selected_zip.is_file(), 'Selected native ZIP must be staged before upload'
          with zipfile.ZipFile(selected_zip) as proof:
              assert proof.testzip() is None
              assert len([name for name in proof.namelist() if name.startswith('images/') and name.endswith('.png')])==38
          manifest=json.loads(Path('work/selected-rgb/selection.json').read_text())
          assert manifest['selected_candidate']==selected
          assert manifest['selected_native_zip_sha256']==hashlib.sha256(selected_zip.read_bytes()).hexdigest()
          print('PRIVATE_SELECTED_RGB_NATIVE',selected,hashlib.sha256(selected_zip.read_bytes()).hexdigest())
          screenshots=Path('work/editor/screenshots')
          frames=sorted(screenshots.rglob('*.png'))
          assert len(frames)>=98,'All native frames must be present before a draft can be saved'
          evidence=Path(os.environ['ALL_FRAME_EVIDENCE'])
          extras=[
              Path('work/editor/art-review/artistic-evidence-report.json'),
              Path('work/editor/art-review/artistic-review-contact-sheet.png'),
              Path('work/editor/visual-continuity-report.json'),
              Path('work/editor/native-aim-report.json'),
              Path('work/editor/render-anomaly-report.json'),
              Path('work/fidelity/fidelity-report.json'),
              Path('work/fidelity/psd-effect-footprints.json'),
              Path('work/editor/editor-roundtrip-report.json')]
          # The corrected candidate is never published as original. Preserve
          # it only in this PRIVATE draft under a separate rgb-editor/ path.
          rgb_root=Path('work/rgb-editor')
          rgb_frames=sorted((rgb_root/'screenshots').rglob('*.png'))
          initial_rgb_verdict_file=rgb_root/'rgb-candidate-final-verdict.json'
          if initial_rgb_verdict_file.is_file():
              verdict=json.loads(initial_rgb_verdict_file.read_text())
              assert verdict.get('real_licensed_spine_editor_4_3_26') is True
              assert verdict.get('artistic_quality_approved') is False
              assert verdict.get('release_ready') is False
              assert len(rgb_frames)>=98
              extras += [
                  rgb_root/'editor-roundtrip-report.json',
                  rgb_root/'psd-editor-rgb-candidate-parity.json',
                  rgb_root/'rgb-candidate-final-verdict.json',
                  rgb_root/'rgb-candidate-render-anomaly.json',
                  rgb_root/'rgb-candidate-motion-continuity.json']
          selected_frames=sorted(Path('work/rgb-feedback/editor/screenshots').rglob('*.png'))
          assert len(selected_frames)>=98
          # The first-feedback render can differ from the selected feedback_2
          # candidate. Archive the actual selected, licensed 98 PNGs separately.
          selected_native_frames=sorted((editor/'screenshots').rglob('*.png'))
          assert len(selected_native_frames)==98, 'Selected RGB native candidate needs 98 PNGs'
          for clip in ('shoot_up_01','shoot_up_02'):
              assert len([f for f in selected_native_frames if f.parent.name==clip])==49
          extras += [Path('work/rgb-feedback/final-verdict.json'),
                     Path('work/rgb-feedback/editor/psd-editor-feedback-parity.json'),
                     Path('work/rgb-feedback/editor/editor-roundtrip-report.json')]
          with zipfile.ZipFile(evidence,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as archive:
              for file in [*frames,*rgb_frames,*selected_frames,*extras]:
                  assert file.is_file() and not file.is_symlink()
                  archive.write(file,arcname=file.as_posix().replace('work/','',1))
              for file in selected_native_frames:
                  assert file.is_file() and not file.is_symlink()
                  archive.write(file,'selected-rgb/screenshots/'+file.relative_to(editor/'screenshots').as_posix())
              archive.writestr('selected-rgb/selection.json',json.dumps({
                  'selected_candidate':selected,
                  'source_psd_sha256':rgb_verdict['photoshop_reference_sha256'],
                  'selected_candidate_zip_sha256':hashlib.sha256(candidate.read_bytes()).hexdigest(),
                  'selected_native_zip_sha256':hashlib.sha256(selected_zip.read_bytes()).hexdigest(),
              },sort_keys=True))
              archive.write(native_report,'selected-rgb/editor-roundtrip-report.json')
              archive.write(parity,'selected-rgb/psd-editor-parity.json')
              archive.write(Path('work/selected-rgb/selected-native-frame-sha256.json'),
                            'selected-rgb/selected-native-frame-sha256.json')
          with zipfile.ZipFile(evidence) as archive:
              assert archive.testzip() is None
              assert len([x for x in archive.namelist() if x.startswith('editor/screenshots/') and x.endswith('.png')])==len(frames)
              assert len([x for x in archive.namelist() if x.startswith('selected-rgb/screenshots/') and x.endswith('.png')])==98
              assert len(archive.namelist())==len(set(archive.namelist()))
          assert evidence.stat().st_size<2*1024**3,'GitHub Release assets have a 2 GiB per-file limit'
          for file in (original,evidence,selected_zip):
              digest=hashlib.file_digest(open(file,'rb'),'sha256').hexdigest()
              print('PRIVATE_NATIVE_DRAFT_ASSET_SHA256',file,digest)
          print('NATIVE_UNAPPROVED_FRAME_COUNT',len(frames))
          PY
          TAG="evidence/clgb71/${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          cat > "$RUNNER_TEMP/clgb71-native-evidence-notes.txt" <<EOF
          PRIVATE TECHNICAL EVIDENCE ONLY — NOT AN ARTISTIC OR PUBLIC RELEASE.

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          3Spine source commit: $THREESPINE_SHA
          Original source repository: ${SOURCE_REPO:-unknown}
          Original source ZIP run: ${SOURCE_RUN_SELECTED:-unknown}
          Original source ZIP artifact: ${SOURCE_ARTIFACT_ID:-unknown}

          Spine Editor 4.3.26 native import and frame evidence.
          38 source PNG layers preserved. Separate licensed Editor RGB-matched ZIP included. Art review NOT APPROVED.
          Both archives have a SHA-256 digest in the linked Actions job log.
          EOF
          gh release create "$TAG" \
            "$NATIVE_ZIP" "$ALL_FRAME_EVIDENCE" "$SELECTED_RGB_ZIP" \
            --draft --latest=false --target "$GITHUB_SHA" \
            --title "Private unapproved clgb71 native evidence run $GITHUB_RUN_ID" \
            --notes-file "$RUNNER_TEMP/clgb71-native-evidence-notes.txt"
          gh release view "$TAG" --repo "$GH_REPO" --json isDraft,tagName,assets > "$RUNNER_TEMP/private-release-view.json"
          jq -e --arg tag "$TAG" \
            --arg native "$(basename "$NATIVE_ZIP")" \
            --arg frames "$(basename "$ALL_FRAME_EVIDENCE")" \
            --arg selected "$(basename "$SELECTED_RGB_ZIP")" \
            ".isDraft == true and .tagName == \$tag and
             ([.assets[].name] | index(\$native) != null and index(\$frames) != null and index(\$selected) != null)" \
            "$RUNNER_TEMP/private-release-view.json"
          echo "PRIVATE_DRAFT_NATIVE_EVIDENCE_STORED $TAG"
          {
            echo '### Native evidence stored privately after Actions artifact quota refusal'
            printf 'Draft tag: %s (private repository only)\n' "$TAG"
            echo 'Technical import was verified; artistic approval remains **false**.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail closed if a PR cannot retain its native evidence
        if: ${{ always() && steps.artifact_upload.outcome == 'failure' && github.event_name == 'pull_request' && steps.private_draft_evidence.outcome != 'success' }}
        shell: bash
        run: |
          echo '::error::PR native evidence could not be retained; never approve without artifacts'
          exit 1

      - name: Deactivate licensed Editor for this ephemeral runner
        if: always()
        shell: bash
        run: |
          if [ -n "${SPINE_CLI:-}" ] && [ -x "$SPINE_CLI" ]; then
            timeout 180 xvfb-run -a "$SPINE_CLI" -l >/dev/null 2>&1 || true
          fi
