name: Public Ubuntu executor | spine link native export smoke
on:
  workflow_call:
    secrets:
      SOURCE_REPO_TOKEN:
        required: false
      SPINE_LICENSE:
        required: false
      SPINE_LINUX_URL:
        required: false
    secrets:
      SOURCE_REPO_TOKEN:
        required: true
      SPINE_LICENSE:
        required: false
      SPINE_LINUX_URL:
        required: false
permissions:
  contents: read
jobs:
  official-project:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    defaults:
      run:
        working-directory: 3spine
    env:
      SPINE_LICENSE: ${{ secrets.SPINE_LICENSE }}
      SPINE_LINUX_URL: ${{ secrets.SPINE_LINUX_URL }}
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - name: Checkout private 3Spine source
        uses: actions/checkout@v4
        with:
          repository: vladleopold/3Spine-core
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: 3spine
          persist-credentials: false

      - name: Test safe legacy image-path recovery
        run: node --test tests/spine-editor-export.test.mjs

      - name: Read official public-domain Spine project and images
        uses: actions/checkout@v4
        with:
          repository: EsotericSoftware/spine-runtimes
          ref: '4.3'
          path: 3spine/official
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            examples/spineboy/spineboy-ess.spine
            examples/spineboy/images
            examples/spineboy/license.txt
          sparse-checkout-cone-mode: false

      - name: Install prelicensed Spine Editor in Ubuntu
        run: |
          set -euo pipefail
          test -n "$SPINE_LICENSE" || { echo "::error::License secret missing"; exit 1; }
          test -n "$SPINE_LINUX_URL" || { echo "::error::Licensed editor archive secret missing"; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11-utils x11-xserver-utils \
            libxrandr2 libgl1-mesa-dri libgl1 libxrender1 libxi6 libxext6 libxfixes3 libxcursor1
          curl --fail --location --silent --show-error --max-time 600 --retry 2 \
            -A 'Mozilla/5.0 (X11; Linux x86_64)' \
            "$SPINE_LINUX_URL" -o "$RUNNER_TEMP/spine-linux.gz"
          gzip -t "$RUNNER_TEMP/spine-linux.gz"
          mkdir -p "$RUNNER_TEMP/spine"
          gzip -dc "$RUNNER_TEMP/spine-linux.gz" | tar -xf - -C "$RUNNER_TEMP/spine"
          SPINE_CLI="$RUNNER_TEMP/spine/Spine/Spine.sh"
          test -x "$SPINE_CLI"
          echo "SPINE_CLI=$SPINE_CLI" >> "$GITHUB_ENV"

      - name: Export real .spine project into JSON + atlas + PNG
        run: |
          set -euo pipefail
          mkdir -p out
          # The launcher requests activation on stdin for a new CI runner.
          printf '%s\n' "$SPINE_LICENSE" | timeout 240 xvfb-run -a -s '-screen 0 1600x1000x24' \
            "$SPINE_CLI" --update 4.3.26 \
            --input "$GITHUB_WORKSPACE/3spine/official/examples/spineboy/spineboy-ess.spine" \
            --output "$GITHUB_WORKSPACE/out" --export json+pack

      - name: Export a complete Spine project through the Spine-Link cloud exporter
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$GITHUB_WORKSPACE/storage/library_02/spine-link-native-export-e2e"
          mkdir -p "$PROJECT_DIR/images" "$PROJECT_DIR/export"
          cp official/examples/spineboy/spineboy-ess.spine "$PROJECT_DIR/spineboy-ess.spine"
          cp -a official/examples/spineboy/images/. "$PROJECT_DIR/images/"
          test -s "$PROJECT_DIR/spineboy-ess.spine"
          test "$(find "$PROJECT_DIR/images" -type f | wc -l)" -gt 0
          xvfb-run -a node --input-type=module <<'NODE'
          import path from 'node:path';
          import { runLicensedSpineExport } from './scripts/spine-editor-export.mjs';
          const workspaceRoot = path.join(process.env.GITHUB_WORKSPACE, '3spine');
          const projectDir = path.join(workspaceRoot, 'storage', 'library_02', 'spine-link-native-export-e2e');
          const result = runLicensedSpineExport({
            cli: process.env.SPINE_CLI,
            project: path.join(projectDir, 'spineboy-ess.spine'),
            output: path.join(projectDir, 'export'),
            images: path.join(projectDir, 'images'),
            workspaceRoot,
            license: process.env.SPINE_LICENSE,
            timeoutMs: 240000,
          });
          console.log('PASS source-preserving image-path recovery:', result.remappedPaths.length, 'path(s)');
          NODE

      - name: Verify Spine-Link cloud export result
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          const root='storage/library_02/spine-link-native-export-e2e/export';
          const files=fs.readdirSync(root);
          const json=files.find(s=>s.endsWith('.json'));
          const atlas=files.find(s=>s.endsWith('.atlas'));
          const png=files.filter(s=>/\.png$/i.test(s));
          assert.ok(json,'Spine-Link cloud exporter must produce runtime JSON');
          assert.ok(atlas,'Spine-Link cloud exporter must pack an atlas');
          assert.ok(png.length,'Spine-Link cloud exporter must pack texture pages');
          const skeleton=JSON.parse(fs.readFileSync(path.join(root,json),'utf8'));
          assert.match(skeleton.skeleton.spine,/^4\.3\./);
          const animations=Object.keys(skeleton.animations||{});
          assert.ok(animations.length,'Spine-Link cloud export must retain animations');
          const atlasText=fs.readFileSync(path.join(root,atlas),'utf8');
          const pages=[...atlasText.matchAll(/^([^\r\n]+\.png)\s*$/gmi)].map(m=>m[1]);
          assert.ok(pages.length,'Spine-Link cloud export atlas must reference texture pages');
          for(const page of pages)assert.ok(fs.existsSync(path.join(root,page)),'missing '+page);
          console.log('PASS Spine-Link cloud exporter: Spine',skeleton.skeleton.spine,'animations',animations.length,'texture pages',pages.length);
          NODE

      - name: Verify playable runtime and texture pages
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          const root='out';
          const files=fs.readdirSync(root);
          const json=files.find(s=>s.endsWith('.json'));
          const atlas=files.find(s=>s.endsWith('.atlas'));
          const png=files.filter(s=>/\.png$/i.test(s));
          assert.ok(json,'editor must export runtime JSON');
          assert.ok(atlas,'editor must pack atlas');
          assert.ok(png.length,'editor must pack textures');
          const skeleton=JSON.parse(fs.readFileSync(path.join(root,json),'utf8'));
          assert.match(skeleton.skeleton.spine,/^4\.3\./);
          assert.ok(Object.keys(skeleton.animations||{}).length,'must be animated');
          const atlasText=fs.readFileSync(path.join(root,atlas),'utf8');
          const pages=[...atlasText.matchAll(/^([^\r\n]+\.png)\s*$/gmi)].map(m=>m[1]);
          assert.ok(pages.length,'atlas must reference pages');
          for(const page of pages)assert.ok(fs.existsSync(path.join(root,page)),'missing '+page);
          console.log('PASS licensed native .spine to playable Spine 4.3 JSON+atlas+PNG, animations:',Object.keys(skeleton.animations).length);
          NODE

      - name: Deactivate temporary editor session
        if: always()
        run: |
          if [ -n "${SPINE_CLI:-}" ] && [ -x "$SPINE_CLI" ]; then
            timeout 180 xvfb-run -a "$SPINE_CLI" -l >/dev/null 2>&1 || true
          fi
