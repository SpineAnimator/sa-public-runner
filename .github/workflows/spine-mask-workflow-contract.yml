name: Public runner reusable workflow contract
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - 'tests/test_bridge_public_executor_contract.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actionlint:
    name: Validate public reusable workflows on Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout the Bridge source repository to verify thin delegation
        uses: actions/checkout@v4
        with:
          repository: SpineAnimator/Spine-Resize
          ref: main
          path: repos/spine-resize
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Bridge and Spine Saver public executor contracts
        run: |
          python -m unittest discover -s tests -p test_bridge_public_executor_contract.py -v
          python -m unittest discover -s tests -p test_saver_public_executor_contract.py -v
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: false
      - name: Lint and enforce public runner contracts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t workflows < <(find .github/workflows -maxdepth 1 -type f -name '*.yml' -print | sort)
          test "${#workflows[@]}" -gt 0
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 "${workflows[@]}"
          for workflow in "${workflows[@]}"; do
            if grep -Eiq '^[[:space:]]*runs-on:[[:space:]]*\\[?self-hosted' "$workflow"; then
              echo "::error::Private runner label found in $workflow"
              exit 1
            fi
            if [ "$workflow" = ".github/workflows/build-mask-bridge.yml" ]; then
              grep -Fq 'runs-on: windows-latest' "$workflow"
              grep -Fq 'runs-on: macos-latest' "$workflow"
              test "$(grep -c 'runs-on: ubuntu-24.04' "$workflow")" -ge 2
            elif [ "$workflow" = ".github/workflows/spine-mask-bridge-platform-tests.yml" ]; then
              grep -Fq 'os: [ubuntu-24.04, windows-latest, macos-latest]' "$workflow"
            elif grep -Eq '^[[:space:]]*runs-on:' "$workflow" && ! grep -Fq 'runs-on: ubuntu-24.04' "$workflow"; then
              echo "::error::Only the cross-platform Bridge builder may use Windows/macOS hosted executors: $workflow"
              exit 1
            fi
          done
          echo 'SA_PUBLIC_REUSABLE_WORKFLOWS_USE_APPROVED_GITHUB_HOSTED_EXECUTORS_PASS' >> "$GITHUB_STEP_SUMMARY"
