name: Public runner reusable workflow contract
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actionlint:
    name: Validate public reusable workflows on Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: false
      - name: Lint and enforce public runner contracts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t workflows < <(find .github/workflows -maxdepth 1 -type f -name '*.yml' -print | sort)
          test "${#workflows[@]}" -gt 0
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 "${workflows[@]}"
          for workflow in "${workflows[@]}"; do
            if grep -Eq '^[[:space:]]*runs-on:[[:space:]]*\\[?self-hosted' "$workflow"; then
              echo "::error::Private runner label found in $workflow"
              exit 1
            fi
            if grep -Eq '^[[:space:]]*runs-on:' "$workflow" && ! grep -Fq 'runs-on: ubuntu-24.04' "$workflow"; then
              echo "::error::Every public runner job must use ubuntu-24.04: $workflow"
              exit 1
            fi
          done
          echo 'SA_PUBLIC_REUSABLE_WORKFLOWS_USE_GITHUB_HOSTED_UBUNTU_PASS' >> "$GITHUB_STEP_SUMMARY"
