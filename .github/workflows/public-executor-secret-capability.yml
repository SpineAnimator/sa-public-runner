name: Public executor secret capability (presence only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-executor-secret-capability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capability:
    name: Check public executor configuration without exposing values
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Report configured secret names only
        shell: bash
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          SPINE_LICENSE: ${{ secrets.SPINE_LICENSE }}
          SPINE_LINUX_URL: ${{ secrets.SPINE_LINUX_URL }}
        run: |
          set -euo pipefail
          for key in SOURCE_REPO_TOKEN ACCESS_TOKEN SPINE_LICENSE SPINE_LINUX_URL; do
            if [ -n "${!key}" ]; then
              echo "$key=available"
            else
              echo "$key=missing"
            fi
          done
